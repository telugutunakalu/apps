<!doctype html>
<html lang="te" data-theme="dark" data-accent="peacock">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0c16">
<title>అంకెల ఆట — తెలుగు అంకెలు నేర్చుకుందాం</title>
<meta name="description" content="తెలుగు అంకెలు (౧, ౨, ౩…) చూసి సరైన సంఖ్య ఉన్న బుడగను తాకండి. ఐదు స్థాయిలు, మూడు జీవితాలు.">
<meta property="og:title" content="అంకెల ఆట — తెలుగు తునకలు">
<meta property="og:description" content="తెలుగు అంకెలు నేర్చుకుందాం రండి!">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2322c3d6'/%3E%3Ccircle cx='32' cy='33' r='22' fill='%2300222a'/%3E%3Ccircle cx='24' cy='24' r='4' fill='%23fff' opacity='.7'/%3E%3Ctext x='32' y='44' font-size='30' font-weight='700' text-anchor='middle' fill='%23fff'%3E%E0%B1%A7%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="./lib/v1/tt.css">
<style>
  /* A DOM quiz needs no gesture lock: keep pinch-zoom (buttons are already touch-action: manipulation). */
  .tt-app--game { touch-action: manipulation; }
  .tt-stage { background: radial-gradient(120% 70% at 50% 0%, color-mix(in srgb, var(--tt-accent) 16%, var(--tt-bg)) 0%, var(--tt-bg) 62%); }
  .tt-iconbtn[hidden], .tt-pill[hidden] { display: none; }
  .tt-back { min-width: var(--tt-tap); justify-content: center; }   /* kit: icon-only back link is 40px wide on phones */
  .tt-app--game .tt-topbar { z-index: 31; }   /* keep back / sound / help / settings usable above the cards (overlay padding clears it) */

  /* ---------- play area: one grid, never scrolls ---------- */
  .play { position: absolute; z-index: 2; inset: 0; margin: 0 auto; width: min(100%, 760px);
          display: grid; grid-template-columns: minmax(0, 1fr);
          grid-template-rows: auto auto minmax(0, 1fr) auto auto auto;
          grid-template-areas: "hud" "lvl" "prompt" "fb" "answers" "tools";
          gap: 8px; padding: calc(60px + var(--tt-safe-t)) calc(14px + var(--tt-safe-r)) calc(12px + var(--tt-safe-b)) calc(14px + var(--tt-safe-l));
          transition: opacity .25s; }
  .play.is-away { opacity: 0; pointer-events: none; }

  .hud { grid-area: hud; display: flex; justify-content: center; gap: 6px; flex-wrap: nowrap; min-width: 0; }
  .hud .tt-pill { min-height: 34px; padding: 4px 12px; font-size: 15px; white-space: nowrap; }
  .hud .tt-pill small { font-size: 13px; }
  .hud .star { color: var(--tt-accent); }
  .hearts b { color: #ff4d6d; letter-spacing: 1px; }
  .hearts i { color: var(--tt-faint); font-style: normal; letter-spacing: 1px; }
  .streak b { color: var(--tt-warn); }
  .streak .mult { color: var(--tt-accent); }
  .bump { animation: bump .32s var(--tt-ease); }
  @keyframes bump { 50% { transform: scale(1.16); } }
  .shake { animation: shake .4s ease; }
  @keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
  .hud.tight small { display: none; }          /* labels drop out only when the pills would not fit */
  .hud.tight .tt-pill { padding: 4px 10px; }
  @media (max-width: 359px) { .tt-topbar__title { opacity: 0; } }   /* only "అం…" would fit beside five buttons; the cards carry the name */

  .lvl { grid-area: lvl; display: flex; flex-direction: column; align-items: center; gap: 5px; text-align: center; min-width: 0; }
  .lvl .name { font-size: 15px; line-height: 1.3; color: var(--tt-muted); }
  .progress { display: flex; align-items: center; gap: 8px; }
  .dots { display: flex; gap: 5px; }
  .dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--tt-line); transition: background .25s, box-shadow .25s; }
  .dots i.on { background: var(--tt-accent); box-shadow: 0 0 8px color-mix(in srgb, var(--tt-accent) 70%, transparent); }
  .progress small { font-size: 12.5px; color: var(--tt-faint); font-variant-numeric: tabular-nums; }

  /* ---------- the question ---------- */
  .prompt { grid-area: prompt; position: relative; min-height: 0; overflow: hidden; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 2px; padding: 6px 12px; border-radius: 26px;
            background: color-mix(in srgb, var(--tt-surface) 55%, transparent); border: 1px solid var(--tt-glass-line);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .cap { font-size: 15px; line-height: 1.3; color: var(--tt-muted); text-align: center; }
  .num { font-weight: 800; line-height: 1.15; white-space: nowrap; font-variant-numeric: tabular-nums; color: #fff;
         font-size: 70px; font-size: clamp(52px, min(22vw, 14dvh), 150px);
         text-shadow: 0 0 26px color-mix(in srgb, var(--tt-accent) 65%, transparent), 0 4px 0 rgba(0, 0, 0, .25); }
  .num[hidden], .hint[hidden], .listen[hidden], .bub[hidden] { display: none; }
  .num .sep { color: var(--tt-muted); }
  .prompt.has-hint .num { font-size: clamp(42px, min(17vw, 10dvh), 118px); }
  /* where supported, the number fills its card: limited by the card height and by its own width (--w, in em) */
  @supports (font-size: 1cqh) {
    .prompt { container-type: size; }
    .num { font-size: max(34px, min(50cqh, calc(86cqw / var(--w, 1)), 230px)); }
    .prompt.has-hint .num { font-size: max(30px, min(34cqh, calc(86cqw / var(--w, 1)), 170px)); }
    .listen { width: clamp(64px, 40cqh, 130px); }
  }
  .hint { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: center; gap: 2px 8px; font-size: 22px; font-weight: 800; line-height: 1.3; }
  .hint .op { color: var(--tt-faint); font-weight: 500; }
  .hint .count { letter-spacing: 3px; font-size: 18px; }
  /* place-value colours, shared by the hint and the prompt digits (ones, tens, hundreds, thousands) */
  .p0 { --pc: #5ee08f; } .p1 { --pc: #ff7aa8; } .p2 { --pc: #ffc233; } .p3 { --pc: #a99bff; }
  .hint [class^="p"], .has-hint .num [class^="p"] { color: var(--pc); }
  .listen { display: grid; place-items: center; width: clamp(72px, 15dvh, 116px); aspect-ratio: 1; border-radius: 50%; border: 0; cursor: pointer; margin: 4px 0;
            background: var(--tt-accent); color: var(--tt-accent-ink); box-shadow: 0 10px 30px color-mix(in srgb, var(--tt-accent) 40%, transparent); }
  .listen .tt-icon { width: 46%; height: 46%; }
  .listen.speaking { animation: ring 1.1s ease-out 2; }
  @keyframes ring { from { box-shadow: 0 0 0 0 color-mix(in srgb, var(--tt-accent) 60%, transparent); } to { box-shadow: 0 0 0 26px transparent; } }

  /* feedback has its own fixed slot: it can never cover the score or the question */
  .fb { grid-area: fb; height: 40px; display: flex; align-items: center; justify-content: center; gap: 10px; overflow: hidden;
        white-space: nowrap; font-weight: 800; font-size: clamp(16px, 4.6vw, 21px); line-height: 1.2; }
  .fb .ok { color: var(--tt-good); } .fb .no { color: var(--tt-bad); }
  .fb .eq { color: var(--tt-ink); font-weight: 700; font-variant-numeric: tabular-nums; }
  .fb .pts { color: var(--tt-accent); }
  .fb > * { animation: tt-pop .25s var(--tt-ease); }
  @media (max-width: 359px) { .fb .lbl { display: none; } }

  /* ---------- answer bubbles: real buttons ---------- */
  .answers { grid-area: answers; display: grid; justify-content: center; align-content: center; gap: 12px 16px;
             --cols: 2; --bsz: min(40vw, 19vh, 150px); --bsz: min(40vw, 19dvh, 150px);
             grid-template-columns: repeat(var(--cols), var(--bsz)); }
  .answers[data-n="3"] { --cols: 3; --bsz: min(28vw, 21vh, 140px); --bsz: min(28vw, 21dvh, 140px); }
  .bub { position: relative; width: var(--bsz); height: var(--bsz); padding: 0; border: 0; border-radius: 50%; cursor: pointer;
         display: grid; place-items: center; color: #fff; font-family: var(--tt-font); font-weight: 800; line-height: 1;
         font-size: calc(var(--bsz) * var(--fs, .38)); font-variant-numeric: tabular-nums; text-shadow: 0 2px 6px rgba(0, 0, 0, .35);
         touch-action: manipulation; user-select: none; -webkit-user-select: none;
         background:
           radial-gradient(circle at 31% 25%, rgba(255, 255, 255, .8) 0 4%, rgba(255, 255, 255, 0) 13%),
           radial-gradient(circle at 50% 115%, color-mix(in srgb, var(--tt-accent) 80%, #fff) 0%, transparent 52%),
           radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--tt-accent) 50%, #06303a) 0%, color-mix(in srgb, var(--tt-accent) 30%, #021217) 78%);
         box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--tt-accent) 75%, #fff), inset 0 -10px 24px rgba(0, 0, 0, .35),
                     0 12px 28px rgba(0, 0, 0, .4), 0 0 26px color-mix(in srgb, var(--tt-accent) 28%, transparent);
         animation: float var(--dur, 3.4s) ease-in-out var(--d, 0s) infinite; transition: filter .15s, opacity .25s; }
  .bub[data-len="3"] { --fs: .31; } .bub[data-len="4"] { --fs: .25; } .bub[data-len="5"] { --fs: .22; }
  @keyframes float { 0%, 100% { translate: 0 0; } 50% { translate: 0 calc(var(--bsz) * -.05); } }
  @media (hover: hover) { .bub:hover { filter: brightness(1.18); } }
  .bub:active { filter: brightness(1.25); }
  .bub:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  .bub .k { position: absolute; bottom: 9%; left: 0; right: 0; display: none; font-size: 12px; font-weight: 700; color: rgba(255, 255, 255, .62); text-shadow: none; }
  @media (hover: hover) and (pointer: fine) { .bub .k { display: block; } }
  .bub::after { content: none; position: absolute; top: 0; right: 0; width: 30%; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center;
                background: #fff; font-size: calc(var(--bsz) * .17); text-shadow: none; box-shadow: 0 4px 10px rgba(0, 0, 0, .3); }
  .bub.is-right { background: radial-gradient(circle at 31% 25%, rgba(255, 255, 255, .8) 0 4%, rgba(255, 255, 255, 0) 13%), radial-gradient(circle at 50% 38%, #3fe190 0%, #0c6b3c 80%);
                  box-shadow: inset 0 0 0 2px #b6ffd6, 0 0 34px rgba(52, 209, 126, .6); }
  .bub.is-right::after { content: "✓"; color: #0c6b3c; }
  .bub.is-wrong { background: radial-gradient(circle at 31% 25%, rgba(255, 255, 255, .7) 0 4%, rgba(255, 255, 255, 0) 13%), radial-gradient(circle at 50% 38%, #ff6b7a 0%, #7d0f1f 80%);
                  box-shadow: inset 0 0 0 2px #ffc2c9, 0 0 30px rgba(255, 90, 106, .5); }
  .bub.is-wrong::after { content: "✗"; color: #a3142a; }
  .bub.is-dim { opacity: .3; filter: saturate(.4); }
  .bub[aria-disabled="true"] { cursor: default; }

  .tools { grid-area: tools; display: flex; justify-content: center; gap: 10px; }
  .tools .tt-btn { min-height: 44px; padding: 8px 18px; font-size: 15px; }
  .tools small { font-weight: 600; color: var(--tt-muted); }

  .fx { position: fixed; inset: 0; z-index: 25; pointer-events: none; overflow: hidden; }
  .drop { position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, var(--c, #5ee08f)); }
  .confetti { position: absolute; margin: -0.6em 0 0 -0.3em; font-weight: 800; color: var(--c); font-size: 26px; text-shadow: 0 0 12px var(--c); }
  .flash { position: absolute; inset: 0; z-index: 12; pointer-events: none; opacity: 0; transition: opacity .5s ease-out;
           background: radial-gradient(ellipse at center, transparent 40%, rgba(255, 40, 70, .5)); }
  .flash.on { opacity: 1; transition: none; }

  /* ---------- cards (start / level / game over) ---------- */
  .intro p { margin: 6px 0; }
  .intro .lead { color: var(--tt-ink); font-size: 18px; font-weight: 700; }
  .intro .ctl { color: var(--tt-ink); }
  .intro small { display: block; margin-top: 10px; color: var(--tt-faint); }
  .chart { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; margin: 12px 0 6px; }
  .chart > div { display: grid; padding: 4px 0 3px; border-radius: 10px; line-height: 1.2; background: color-mix(in srgb, var(--tt-accent) 14%, transparent); }
  .chart b { font-size: 22px; color: var(--tt-ink); }
  .chart span { font-size: 13px; color: var(--tt-muted); }
  @media (max-width: 420px) { .chart { grid-template-columns: repeat(5, minmax(0, 1fr)); } }

  /* ---------- wide screens: one row of bubbles under a big number ---------- */
  @media (min-width: 900px) and (min-height: 640px) {
    .play { grid-template-rows: auto auto minmax(200px, 340px) auto auto auto; align-content: center; gap: 12px; }
    .answers, .answers[data-n="3"] { --cols: var(--n, 4); --bsz: min(150px, calc((100vw - 160px) / 4)); }
  }
  /* ---------- phones held sideways: question left, bubbles right ---------- */
  @media (orientation: landscape) and (max-height: 560px) {
    .play { width: 100%; max-width: 1100px; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr);
            grid-template-rows: auto auto minmax(0, 1fr) auto; grid-template-areas: "hud answers" "lvl answers" "prompt answers" "fb tools";
            column-gap: 18px; row-gap: 6px; }
    .answers { --bsz: min(calc((52vw - 70px) / 2), calc((100dvh - 150px) / 2), 140px); }
    .answers[data-n="3"] { --bsz: min(calc((52vw - 90px) / 3), calc(100dvh - 200px), 130px); }
    .num { font-size: clamp(44px, 18dvh, 110px); }
    .prompt.has-hint .num { font-size: clamp(36px, 12dvh, 80px); }
    .fb { height: 44px; }
    .tt-card { padding: 16px 20px; }
    .tt-card h2 { font-size: 26px; }
    .chart { margin: 8px 0 4px; } .chart b { font-size: 18px; }
    .tt-card__actions { margin-top: 12px; }
  }
  @media (max-height: 680px) and (orientation: portrait) {
    .cap { font-size: 13.5px; }
    .prompt.has-hint .cap { display: none; }
    .lvl .name { font-size: 14px; }
  }
</style>
<script type="importmap">{ "imports": { "three": "./lib/v1/vendor/three/three.module.min.js", "three/addons/": "./lib/v1/vendor/three/addons/", "tt/": "./lib/v1/" } }</script>

<body>
<noscript>అంకెల ఆట ఆడటానికి JavaScript అవసరం.</noscript>
<script type="module">
import { createApp, keyControls, haptic, isTouch, params, prefersReducedMotion } from "tt/shell.js";
import { el, setChildren, icon } from "tt/safe.js";
import { sfx, speak, canSpeakTelugu } from "tt/sfx.js";
import * as te from "tt/telugu.js";
import { createBackdrop } from "tt/three-kit.js";

/* ============================== content (from the original game, unchanged) ============================== */
const DEBUG = params().has("debug");
const rand = te.rng(params().has("seed") ? +params().get("seed") : Date.now() >>> 0);
const TELUGU_DIGITS = te.DIGITS;        // ['౦', '౧', '౨', '౩', '౪', '౫', '౬', '౭', '౮', '౯'] — the original's table
const MAX_LEVELS = 5;

let levelConfig = [
    // Level 1: Single digit
    { level: 1, min: 1, max: 9, choices: 3, goal: 5, name: "మొదటి స్థాయి: ఒక అంకె" },
    // Level 2: Two digits (easy)
    { level: 2, min: 10, max: 30, choices: 3, goal: 7, name: "రెండవ స్థాయి: రెండు అంకెలు (సులువు)" },
    // Level 3: Two digits (medium)
    { level: 3, min: 31, max: 99, choices: 4, goal: 7, name: "మూడవ స్థాయి: రెండు అంకెలు (మధ్యస్థం)" },
    // Level 4: Three digits (introduction)
    { level: 4, min: 100, max: 300, choices: 4, goal: 10, name: "నాలుగవ స్థాయి: మూడు అంకెలు (పరిచయం)" },
    // Level 5: Three digits (practice)
    { level: 5, min: 301, max: 999, choices: 4, goal: 10, name: "ఐదవ స్థాయి: మూడు అంకెలు (అభ్యాసం)" }
];
// Optional (setting): 4-digit numbers shown with Indian grouping, e.g. ౪,౩౨౧.
const EXTRA_LEVEL = { level: 6, min: 1000, max: 9999, choices: 4, goal: 10, name: "అదనపు స్థాయి: ౪ అంకెలు", extra: true };

const POINTS = 10;          // per correct answer (original); a streak multiplies it
const HINT_COST = 5;
const ARM_MS = 250;         // a new question ignores input this long: no tap can carry over from the previous screen
const EASE = "cubic-bezier(.2, .8, .2, 1)";

const MODES = {
  te2num: { label: "౪౭ → 47", cap: "ఇది ఏ సంఖ్య?", intro: "తెలుగు అంకెలు చూసి, అదే సంఖ్య ఉన్న బుడగను ఎంచుకోండి." },
  num2te: { label: "47 → ౪౭", cap: "తెలుగు అంకెల్లో ఏది?", intro: "సంఖ్య చూసి, అదే తెలుగు అంకెలు ఉన్న బుడగను ఎంచుకోండి." },
  listen: { label: "🔊 → ౪౭", cap: "విని, సరైనది ఎంచుకోండి", intro: "సంఖ్యను విని, అదే తెలుగు అంకెలు ఉన్న బుడగను ఎంచుకోండి." },
};

/* ============================== app shell ============================== */
const tnum = n => te.formatIndian(n, { telugu: true });          // HUD numbers in Telugu digits
const modeSetting = { key: "mode", label: "ఆట రకం", type: "segmented", default: "te2num", restart: true,
  options: [{ value: "te2num", label: MODES.te2num.label }, { value: "num2te", label: MODES.num2te.label }],
  help: "తెలుగు అంకెలు చూసి సంఖ్య, లేదా సంఖ్య చూసి తెలుగు అంకెలు" };
/** The listening mode is offered only where the device has a Telugu voice (voices can arrive late). */
function offerListening() {
  if (!canSpeakTelugu() || modeSetting.options.some(o => o.value === "listen")) return;
  modeSetting.options.push({ value: "listen", label: MODES.listen.label });
  modeSetting.help = "తెలుగు అంకెలు చూసి సంఖ్య, సంఖ్య చూసి తెలుగు అంకెలు, లేదా విని తెలుగు అంకెలు";
}
offerListening();
window.speechSynthesis?.addEventListener?.("voiceschanged", () => { offerListening(); if (state.phase === "menu") refreshMenu(); });

const allLevels = [...levelConfig, EXTRA_LEVEL];
const range = L => `${tnum(L.min)}–${tnum(L.max)}`;
const SETTINGS = [
  modeSetting,
  { key: "lives", label: "జీవితాలు", type: "segmented", default: 3, restart: true, options: [{ value: 3, label: "౩" }, { value: 5, label: "౫" }] },
  { key: "start", label: "మొదలయ్యే స్థాయి", type: "segmented", default: 1, restart: true,
    options: allLevels.map(L => ({ value: L.level, label: tnum(L.level) })),
    help: allLevels.map(L => `${tnum(L.level)}: ${range(L)}`).join(" · ") + " (౬ = అదనపు స్థాయి)" },
  { key: "extra", label: "అదనపు స్థాయి (౪ అంకెలు)", type: "toggle", default: false, restart: true,
    help: `ఐదవ స్థాయి తర్వాత ${range(EXTRA_LEVEL)} సంఖ్యలు, కామాలతో (౪,౩౨౧)` },
  { key: "speak", label: "సంఖ్యను పలుకు", type: "toggle", default: true, help: "సరైన జవాబు తర్వాత వినిపిస్తుంది (పరికరంలో తెలుగు స్వరం ఉంటేనే)" },
];
const digitChart = () => el("div", { class: "chart", attrs: { role: "list", "aria-label": "తెలుగు అంకెలు" } },

  const next = state.levels[state.idx + 1];
  showOverlay({
    title: "స్థాయి పూర్తయింది!",
    body: el("div", { class: "intro" }, el("p", { text: `తదుపరి: ${next.name}` })),
    stats: [{ label: "మీ పాయింట్లు", value: tnum(state.score) }, { label: "జీవితాలు", value: `${tnum(state.lives)}/${tnum(state.maxLives)}` },
            { label: "ఉత్తమ వరుస", value: tnum(state.bestStreak) }],
    actions: [{ label: "తదుపరి స్థాయి", onClick: () => startLevel(state.idx + 1) }],
  });
}
function finalStats(best) {
  return [{ label: "మీ తుది పాయింట్లు", value: tnum(state.score) }, { label: "ఉత్తమం", value: tnum(best) }, { label: "సరైనవి", value: tnum(state.right) }];
}
function gameOver() {
  state.phase = "over";
  const { best, isNew } = app.best(bestKey()).submit(state.score);
  showOverlay({
    title: "ఆట ముగిసింది!",
    body: isNew ? "కొత్త రికార్డు! 🎉" : `స్థాయి ${tnum(level().level)} వరకు వచ్చారు.`,
    stats: finalStats(best),
    actions: [{ label: "మళ్ళీ ఆడు", onClick: startGame }, { label: "అమరికలు", ghost: true, onClick: app.openSettings }],
  });
}
function gameWon() {
  state.phase = "won"; sfx.play("win"); haptic([30, 40, 30, 40, 60]); celebrate();
  const { best, isNew } = app.best(bestKey()).submit(state.score);
  const canExtra = !state.levels.includes(EXTRA_LEVEL);
  showOverlay({
    title: "అభినందనలు!",
    body: el("div", { class: "intro" }, el("p", { class: "lead", text: "మీరు అన్ని స్థాయిలను పూర్తి చేసారు!" }),
      isNew ? el("p", { text: "కొత్త రికార్డు! 🎉" }) : null,
      canExtra ? el("p", { text: `ఇంకా ఆడాలా? ${EXTRA_LEVEL.name} (${range(EXTRA_LEVEL)})` }) : null),
    stats: finalStats(best),
    actions: [
      canExtra && { label: "అదనపు స్థాయి →", onClick: () => { state.levels = [...state.levels, EXTRA_LEVEL]; startLevel(state.levels.length - 1); } },
      { label: "మళ్ళీ ఆడు", ghost: canExtra, onClick: startGame },
      { label: "అమరికలు", ghost: true, onClick: app.openSettings },
    ],
  });
}
function togglePause() {
  if (state.phase === "paused") return resume();
  if (!["question", "feedback"].includes(state.phase)) return;
  state.pausedFrom = state.phase; state.phase = "paused";
  holdLater(); window.speechSynthesis?.cancel();
  showOverlay({ title: "ఆట ఆగింది", pause: true, actions: [
    { label: "కొనసాగించు", onClick: resume },
    { label: "మళ్ళీ మొదలు", ghost: true, onClick: startGame },
    { label: "అమరికలు", ghost: true, onClick: app.openSettings },
  ] });
}
function resume() {
  if (state.phase !== "paused") return;
  state.phase = state.pausedFrom; hideOverlay();
  state.armedAt = performance.now() + ARM_MS;
  if (!document.hidden) releaseLater();
}

/* ---------- start card ---------- */
const menuCtl = el("p", { class: "ctl" });
const menuNote = el("small");
function refreshMenu() {
  const s = settingsNow();
  const mode = s.mode === "listen" && !canSpeakTelugu() ? "te2num" : s.mode;
  menuCtl.textContent = MODES[mode].intro + (isTouch() ? "" : " (కీలు 1–4)");
  const best = app.best(`${mode}-${s.lives}`).get();
  menuNote.textContent = [MODES[mode].label, `జీవితాలు ${tnum(s.lives)}`, `స్థాయి ${tnum(s.start)} నుండి`, best ? `ఉత్తమం ${tnum(best)}` : null].filter(Boolean).join(" · ");
}
function showMenu() {
  state.phase = "menu"; clearLater();
  refreshMenu();
  showOverlay({
    title: "అంకెల ఆట",
    body: el("div", { class: "intro" }, el("p", { class: "lead", text: "తెలుగు అంకెలను గుర్తించండి!" }), digitChart(), menuCtl, menuNote),
    actions: [{ label: "ఆరంభించు", onClick: startGame }, { label: "అమరికలు", ghost: true, onClick: app.openSettings }],
  });
}

/* ============================== input ============================== */
// Bubbles are <button>s answering on "click": one tap → exactly one click (the last event of the
// gesture), so nothing is left over to hit the next screen. Keyboard: 1–4 pick a bubble.
const pick = i => () => answer(i);
keyControls({
  "1": pick(0), "2": pick(1), "3": pick(2), "4": pick(3),
  [TELUGU_DIGITS[1]]: pick(0), [TELUGU_DIGITS[2]]: pick(1), [TELUGU_DIGITS[3]]: pick(2), [TELUGU_DIGITS[4]]: pick(3),
  KeyH: useHint, KeyR: () => speakPrompt(), " ": () => speakPrompt(), KeyP: togglePause, Escape: togglePause,
});
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { window.speechSynthesis?.cancel(); holdLater(); return; }
  if (state.phase !== "paused") releaseLater();
  if (speakWhenVisible) { speakWhenVisible = false; speakPrompt(); }
});

/* ============================== boot ============================== */
renderHud();
showMenu();
createBackdrop(app.stage, { letters: TELUGU_DIGITS, count: 22, opacity: 0.18 }).catch(() => null);
if (DEBUG) window.__game = { state, levelConfig, EXTRA_LEVEL, MAX_LEVELS, makeChoices, answer, useHint, startGame, togglePause, bubbles, renderHud,
  correctIndex: () => state.answerIdx, wrongIndex: () => state.choices.findIndex((_, i) => i !== state.answerIdx),
  skipWait: () => { if (pending.fn && !pending.held) { clearTimeout(pending.id); runLater(); } } };
</script>
</body>
</html>
