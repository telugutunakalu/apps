/* ============================== generator ============================== */
// Words: { te, syl[], clue:{text|emoji|en} }. Grid cells: { ans, val, across, down, num }.
function generate(words, R, C, maxWords, seed) {
  const rng = te.rng(seed);
  const cand = words.filter(w => w.syl.length >= 2 && w.syl.length <= Math.max(R, C));
  if (!cand.length) return null;
  const attempts = R * C > 150 ? 24 : 40;
  let best = null;
  for (let a = 0; a < attempts; a++) {
    const res = attempt(cand, R, C, maxWords, rng);
    const score = res.words.length * 1000 + res.crossings * 12 + res.filled;
    if (!best || score > best.score) best = { ...res, score };
  }
  return best;
}
function attempt(cand, R, C, maxWords, rng) {
  const cells = Array.from({ length: R }, () => Array.from({ length: C }, () => ({ ans: null, val: "", across: null, down: null, num: null })));
  const words = [], used = new Set(), index = new Map();

}

  assisted = true;
  for (const [r, c] of cells) { const cell = P.cells[r][c]; cell.val = cell.ans; cell.v.textContent = cell.ans; cell.el.classList.remove("bad"); cell.el.classList.add("rev"); }
  P.words.forEach(x => x.clueEl?.classList.toggle("done", isWordDone(x)));
  save(); checkSolved();
}
function clearGrid() {
  for (const row of P.cells) for (const cell of row) if (cell.el) { cell.val = ""; cell.v.textContent = ""; cell.committed = false; cell.el.classList.remove("ok", "bad", "rev", "win"); }
  solved = false; composing = false; paint(); save();
}
function openCluesSheet() {
  if (!P) return;
  const list = dir => [el("h3", { text: dir === "across" ? "అడ్డం" : "నిలువు", style: { margin: "10px 0 4px", color: "var(--tt-muted)", fontSize: "16px" } }),
    P.words.filter(w => w.dir === dir).sort((a, b) => a.num - b.num).map(w => el("div", { class: "clue" + (w === curWord() ? " cur" : "") + (isWordDone(w) ? " done" : ""),
      on: { click: e => { e.currentTarget.closest("dialog").close(); select(w.r, w.c, false, w.dir); } } },
      el("span", { class: "num", text: w.num }), el("span", { class: "txt" }, clueNode(w)), el("span", { class: "len", text: `(${w.w.syl.length})` })))];
  app.sheet("ఆధారాలు", [list("across"), list("down")]);
}
/** "My words" in a sheet on phones: the textarea is borrowed from the page and returned on close. */
function openMine() {
  const home = mine.querySelector(".row"), parts = [csv, home];
  const dlg = app.sheet("నా పదాలు", parts);
  dlg.addEventListener("close", () => { mine.append(...parts); }, { once: true });
}
function openAssist() {
  if (!P) return app.toast("ముందుగా రూపొందించండి", { tone: "bad" });
  const choice = (label, help, fn) => el("button", { type: "button", class: "tt-btn tt-btn--ghost", style: { width: "100%", justifyContent: "flex-start", margin: "6px 0" },
    on: { click: e => { e.target.closest("dialog").close(); fn(); } } }, el("span", { text: label }), el("small", { text: help, style: { color: "var(--tt-muted)", fontWeight: "500" } }));
  app.sheet("సహాయం", [
    choice("ఈ అక్షరం చూపించు", "ఎంచుకున్న గడి", () => reveal([[sel.r, sel.c]])),
    choice("ఈ పదం చూపించు", "ప్రస్తుత పదం", () => reveal(curWord().cells)),
    choice("సమాధానాలు", "అన్నీ చూపించు", () => { reveal(P.words.flatMap(w => w.cells)); app.toast("సమాధానాలు చూపించబడ్డాయి!"); }),
    choice("క్లియర్", "గ్రిడ్ ఖాళీ చేయి", clearGrid),
    choice("ముద్రించు", "ఖాళీ పజిల్ కాగితంపై", () => setTimeout(() => print(), 200)),
    choice("నా పదాలు", "మీ పదాలతో సొంత పజిల్ (word,hint)", () => setTimeout(openMine, 50)),
    choice("పంచుకో", "ఈ పజిల్ లింక్ పంపండి", sharePuzzle),
    el("p", { style: { color: "var(--tt-muted)", fontSize: "14px" }, text: "సహాయం వాడితే ఉత్తమ సమయం నమోదు కాదు." }),
  ]);
}
function checkSolved() {
  if (solved) return;
  for (const row of P.cells) for (const cell of row) if (cell.ans && !(cell.val && te.sameText(cell.val, cell.ans))) return;
  solved = true; stopTimer(); save();
  sfx.play("win");
  let i = 0;
  for (const row of P.cells) for (const cell of row) if (cell.el) { cell.el.classList.remove("bad"); cell.el.classList.add("ok", "win"); cell.el.style.setProperty("--d", `${(i++ % 40) * 35}ms`); }
  const secs = Math.round(elapsed());
  const key = `${P.R}x${P.C}`;
  const res = assisted ? null : app.best(key).submit(secs, { lowerIsBetter: true });
  setTimeout(() => app.overlay({
    title: "అభినందనలు!",
    body: assisted ? "పజిల్ పూర్తయింది (సహాయంతో)." : res.isNew ? `${key} లో కొత్త రికార్డు! 🎉` : "పజిల్ పూర్తయింది!",
    stats: [{ label: "సమయం", value: fmt(secs) }, ...(res ? [{ label: "ఉత్తమం", value: fmt(res.best) }] : []), { label: "పదాలు", value: P.words.length }],
    actions: [{ label: "కొత్త పజిల్", onClick: () => { app.hideOverlay(); newFromSettings(); } }, { label: "మూసివేయి", ghost: true, onClick: app.hideOverlay }],
  }), 900);
}

/* ============================== timer ============================== */
const fmt = s => `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
const elapsed = () => timer.acc + (timer.running ? (performance.now() - timer.start) / 1000 : 0);
function startTimer() { timer.start = performance.now(); timer.running = true; clearInterval(timer.iv); timer.iv = setInterval(renderTimer, 1000); }
function stopTimer() { timer.acc = elapsed(); timer.running = false; clearInterval(timer.iv); renderTimer(); }
function renderTimer() { timerPill.textContent = fmt(Math.floor(elapsed())); }
document.addEventListener("visibilitychange", () => { if (document.hidden && timer.running) { stopTimer(); timer.wasRunning = true; } else if (!document.hidden && timer.wasRunning && !solved) { timer.wasRunning = false; startTimer(); } });

/* ============================== boot ============================== */
bank = (await loadWords()).map(w => ({ te: w.te, syl: w.syllables, clue: clueOf(w) })).filter(w => w.clue);
const q = params();
const saved = store.get("progress", null);
let spec = null;
if (q.has("seed") && q.has("size")) {
  const [R, C] = q.get("size").split("x").map(Number);
  spec = { R: Math.min(15, Math.max(4, R || 9)), C: Math.min(15, Math.max(4, C || 9)), n: +(q.get("n") || 14), seed: +q.get("seed"), lvl: q.get("lvl") || "mix" };
  if (q.has("w")) {
    try { spec.custom = JSON.parse(b64.dec(q.get("w"))).map(([w, h]) => ({ te: te.normalize(w), syl: te.aksharalu(w), clue: { text: h || "(ఆధారం లేదు)" } })); }
    catch { app.toast("లింక్‌లోని పదాలు చదవలేకపోయాం", { tone: "bad" }); spec = null; }
  }
}
const resume = saved && spec && saved.url === location.search ? saved : (!spec && saved?.url && !saved.solved ? saved : null);
if (!spec && resume) { history.replaceState(null, "", location.pathname + resume.url); location.reload(); }
else if (spec) buildPuzzle(spec, { restoreVals: resume ? { ...resume.vals, elapsed: resume.elapsed, assisted: resume.assisted } : null });
else newFromSettings();
if (P && resume?.solved) { solved = false; checkSolved(); }
if (DEBUG) window.__xw = { get P() { return P; }, sel, typeChar, backspace, select, reveal, validateAnswers, generate, bank };
</script>
