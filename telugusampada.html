<script type="module">
import { createApp, createLoop, fontsReady, params, prefersReducedMotion, share } from "tt/shell.js";
import { el, icon } from "tt/safe.js";
import * as te from "tt/telugu.js";
import { THREE, createRenderer, createComposer, autoResize, glyphTexture, Burst, dotTexture, skyDome, qualityTier } from "tt/three-kit.js";

/* ======================================================================================
   DATA — మీ పురోగతిని ఇక్కడ నవీకరించండి (update the numbers here).
   Same numbers as v1 (dashboard.html). To update WITHOUT editing this file, publish a JSON
   file of exactly this shape and open:   telugusampada.html?data=<url-to-json>
   (the host must allow CORS — e.g. raw.githubusercontent.com or a gist "raw" link).
   "updated" is optional ("YYYY-MM-DD"); only when it is present the page shows చివరి నవీకరణ.
   ====================================================================================== */
const DATA = {
  padyarchana: { current: 48785, target: 100000 },   // పద్యార్చన — పద్యాలు (poems)
  padarchana:  { current: 78543, target: 150000 },   // పదార్చన — పదాలు (words)
  updated: null,
};

/* ============================== tuning ============================== */
const DEBUG = params().has("debug");
const tier = qualityTier();
const PROJECTS = {
  padyarchana: { name: "పద్యార్చన", unit: "పద్యాలు" },
  padarchana:  { name: "పదార్చన", unit: "పదాలు" },
};
const KEYS = ["padyarchana", "padarchana"];
const MILESTONES = [0.25, 0.5, 0.75, 1];
const SPEEDS = { slow: 12, normal: 6, fast: 3, instant: 0 };          // seconds; count-up and visual share one clock
const LEAD = 0.55;                                                      // s a drop takes to fall, so it lands as the count passes it
const DROP_BUDGET = { low: 400, mid: 1000, high: 2000 }[tier];          // drops for a full vessel → "one drop = N poems"
const DROP_POOL = { low: 160, mid: 360, high: 600 }[tier];
const BUBBLES = { low: 26, mid: 60, high: 120 }[tier];
const LEAF_BUDGET = { low: 300, mid: 600, high: 1000 }[tier];            // leaves on a full tree → "one leaf = N words"
const FIREFLIES = { low: 0, mid: 12, high: 24 }[tier];
const FALLING = { low: 0, mid: 4, high: 8 }[tier];
const SEGS = { low: 40, mid: 56, high: 72 }[tier];
const DPR_CAP = { low: 1, mid: 1.5, high: 2 }[tier];

/* ============================== app shell ============================== */
const SETTINGS = [
  { key: "showWords", label: "పదార్చన చూపించు", type: "toggle", default: false, help: "పదాల వృక్షం (పదార్చన పురోగతి) కూడా చూపిస్తుంది" },
  { key: "teluguDigits", label: "తెలుగు అంకెలు", type: "toggle", default: false, help: "సంఖ్యలను ౧, ౨, ౩… అంకెలతో చూపిస్తుంది" },
  { key: "speed", label: "యానిమేషన్ వేగం", type: "segmented", default: "normal", help: "లెక్కింపు, నింపడం ఎప్పుడూ కలిసే జరుగుతాయి",
    options: [{ value: "slow", label: "నెమ్మదిగా" }, { value: "normal", label: "మామూలు" }, { value: "fast", label: "వేగంగా" }, { value: "instant", label: "వెంటనే" }] },
  { key: "reduceFx", label: "ఎఫెక్ట్‌లు తగ్గించు", type: "toggle", default: false, help: "మెరుపు, కదిలే కణాలు ఉండవు; లెక్క పూర్తయ్యాక దృశ్యం ఆగుతుంది — బ్యాటరీ ఆదా" },
];
const HELP_TITLE = "ఈ పేజీ గురించి";
const app = createApp({ id: "telugusampada", title: "తెలుగు సంపద", accent: "peacock", settings: SETTINGS, onSettings,
  sound: false, help: () => helpNode(), helpTitle: HELP_TITLE });

const digits = () => !!app.settings.teluguDigits;
const num = n => te.formatIndian(Math.round(n), { telugu: digits() });
const tdig = s => (digits() ? te.toTeluguDigits(s) : String(s));
const pctText = f => tdig((f * 100).toFixed(1)) + "%";
let reducedOS = prefersReducedMotion();
const motionOK = () => !reducedOS;
const ambient = () => motionOK() && !app.settings.reduceFx;
const clamp01 = x => Math.max(0, Math.min(1, x));
const ease = t => 1 - Math.pow(1 - t, 3);                               // one easing for the number AND the picture
function niceUnit(x) { const p = 10 ** Math.floor(Math.log10(Math.max(1, x))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= x) return m * p; return 10 * p; }

/* share button (the kit has no share icon yet — static SVG built here) */
function shareIcon() {
  const NS = "http://www.w3.org/2000/svg", svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 24 24"); svg.setAttribute("aria-hidden", "true"); svg.classList.add("tt-icon");
  for (const d of ["M4 12v7a2 2 0 002 2h12a2 2 0 002-2v-7", "M16 6l-4-4-4 4", "M12 2v13"]) {
    const p = document.createElementNS(NS, "path"); p.setAttribute("d", d); svg.append(p);
  }
  return svg;
}
const shareBtn = el("button", { class: "tt-iconbtn", type: "button", title: "పంచుకోండి", attrs: { "aria-label": "పంచుకోండి" }, on: { click: doShare } }, shareIcon());
app.topbar.insertBefore(shareBtn, app.topbar.querySelector(`[aria-label="${HELP_TITLE}"]`));
function helpNode() {
  const ex = { padyarchana: { current: DATA.padyarchana.current, target: DATA.padyarchana.target },
    padarchana: { current: DATA.padarchana.current, target: DATA.padarchana.target }, updated: "YYYY-MM-DD" };
  return el("div", { class: "help" },
    el("p", { text: `• పద్యార్చన: ప్రతి చుక్క = ${num(P.padyarchana.unitSize ?? 0)} పద్యాలు. కలశం "లక్ష్యం" గీత వరకు నిండితే లక్ష్యం పూర్తి; 25%, 50%, 75% ఉంగరాలు చేరగానే బంగారు రంగులో వెలుగుతాయి.` }),
    el("p", { text: `• పదార్చన: ప్రతి ఆకు = ${num(P.padarchana.unitSize ?? 0)} పదాలు; లేత ఆకులు ఇంకా రావాల్సినవి. అమరికలలో "పదార్చన చూపించు" ఆన్ చేయండి.` }),
    el("p", { text: "• లెక్క, బొమ్మ ఒకే గడియారంతో కలిసి పెరుగుతాయి. బొమ్మ పైన కుడివైపు ఉన్న \"మళ్ళీ చూపించు\" బటన్‌తో మళ్ళీ చూడవచ్చు." }),
    el("p", { text: "• సంఖ్యలు మార్చడానికి HTML మార్చనవసరం లేదు: ఈ రూపంలో ఒక JSON ఫైల్ ప్రచురించి (ఉదా: GitHub gist \"raw\" లింక్), పేజీని ?data=<లింక్> తో తెరవండి. \"updated\" ఇస్తేనే చివరి నవీకరణ కనిపిస్తుంది." }),
    el("pre", {}, el("code", { text: JSON.stringify(ex, null, 1) })));
}

/* ============================== DOM ============================== */
const P = {};   // per project state
const tabs = el("div", { class: "tabs", hidden: true, attrs: { role: "tablist", "aria-label": "ప్రాజెక్టులు" } });
const panelsEl = el("div", { class: "panels" });
const dash = el("div", { class: "dash", dataset: { mode: "single" } }, tabs, panelsEl);
app.stage.append(dash);
let activeTab = "padyarchana";

function buildPanel(key) {
  const meta = PROJECTS[key];
  const legend = el("div", { class: "viz__legend", attrs: { "aria-hidden": "true" } });
  const viz = el("div", { class: "viz" },
    el("div", { class: "viz__head" }, el("h2", { class: "viz__title", text: meta.name }), legend),
    el("button", { class: "tt-iconbtn viz__replay", type: "button", title: "మళ్ళీ చూపించు", attrs: { "aria-label": `${meta.name}: మళ్ళీ చూపించు` },
      on: { click: () => replay(key) } }, icon("restart")));
  const now = el("b", { class: "count__now", text: "0", attrs: { "aria-hidden": "true" } });
  const of = el("span", { class: "count__of", attrs: { "aria-hidden": "true" } });
  const barFill = el("i");
  const bar = el("div", { class: "bar", attrs: { "aria-hidden": "true" } }, barFill, MILESTONES.slice(0, 3).map(m => el("b", { style: { left: m * 100 + "%" } })));
  const pct = el("span", { class: "pct", attrs: { "aria-hidden": "true" } });
  const remainVal = el("b"), remainUnit = el("span");
  const remain = el("p", { class: "line", attrs: { "aria-hidden": "true" } }, el("span", { text: "లక్ష్యానికి ఇంకా " }), remainVal, remainUnit);
  const win = el("p", { class: "line line--win", hidden: true, text: "లక్ష్యం చేరుకున్నాం!" });
  const miles = MILESTONES.map(() => el("li", {}, el("span", { class: "m-p" }), el("span", { class: "m-v" })));
  const nextVal = el("b"), nextLeft = el("b");
  const next = el("p", { class: "line", attrs: { "aria-hidden": "true" } }, el("span", { text: "తదుపరి మైలురాయి " }), nextVal, el("span", { text: " · ఇంకా " }), nextLeft);
  const metaLine = el("p", { class: "meta", hidden: true });
  const sr = el("p", { class: "tt-visually-hidden" });
  const stats = el("div", { class: "stats" },
    el("div", { class: "count" }, now, of), el("div", { class: "barrow" }, bar, pct), remain, win,
    el("ol", { class: "miles", attrs: { "aria-label": "మైలురాళ్ళు" } }, miles), next, metaLine, sr);
  const panel = el("section", { class: "panel", id: "p-" + key, hidden: key !== "padyarchana", attrs: { "aria-label": meta.name } }, el("div", { class: "panel__in" }, viz, stats));
  panelsEl.append(panel);
  const tab = el("button", { type: "button", text: meta.name, attrs: { role: "tab", "aria-controls": "p-" + key, "aria-selected": "false" },
    on: { click: () => { if (activeTab !== key) { activeTab = key; layout(); } } } });
  tabs.append(tab);

async function loadData() {
  const url = params().get("data");
  const base = { padyarchana: { ...DATA.padyarchana }, padarchana: { ...DATA.padarchana }, updated: DATA.updated };
  if (!url) return base;
  try {
    const abs = new URL(url, location.href);

    const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), 8000);
    const res = await fetch(abs, { signal: ctrl.signal, cache: "no-store", credentials: "omit" });

    const json = await res.json();

    source = abs.protocol === "data:" ? "లింక్‌లోని డేటా" : abs.hostname;
    return {
      padyarchana: cleanProject(json.padyarchana, DATA.padyarchana),
      padarchana: cleanProject(json.padarchana, DATA.padarchana),
      updated: typeof json.updated === "string" || typeof json.updated === "number" ? String(json.updated).slice(0, 40) : null,
    };

}

  kick();
}
matchMedia("(prefers-reduced-motion: reduce)").addEventListener?.("change", e => { reducedOS = e.matches; if (reducedOS) { loop.stop(); KEYS.forEach(k => { P[k].anim.dur = 0; }); } kick(); });

/* ============================== layout ============================== */
const splitMQ = matchMedia("(min-width: 1000px) and (min-height: 560px)");
splitMQ.addEventListener?.("change", () => layout());
function layout() {
  const both = !!app.settings.showWords;
  const mode = !both ? "single" : splitMQ.matches ? "split" : "tabs";
  dash.dataset.mode = mode;
  tabs.hidden = mode !== "tabs";
  if (!both) activeTab = "padyarchana";
  for (const k of KEYS) {
    const p = P[k], on = k === "padyarchana" || both;
    p.el.panel.hidden = !on;
    p.el.panel.classList.toggle("is-active", mode !== "tabs" || activeTab === k);
    p.el.tab.setAttribute("aria-selected", String(activeTab === k));
    p.el.tab.tabIndex = activeTab === k ? 0 : -1;
  }
  if (both && ready && !P.padarchana.view && !P.padarchana.noGL) createView("padarchana");
  for (const k of KEYS) { const v = P[k].view; if (v?.w && visibleNow(k)) v.fit(v.w, v.h); }
  kick();
}
function createView(key) {
  const p = P[key];
  p.view = key === "padyarchana" ? vesselView(p) : treeView(p);
  if (!p.view) { p.noGL = true; p.unitSize = niceUnit(p.data.target / (key === "padyarchana" ? DROP_BUDGET : LEAF_BUDGET)); }
  else {   // warm up: draw the full state once so every shader is compiled before the clock starts
    p.view.setProgress(1, 1, false, performance.now()); p.view.composer.render();
    p.view.reset(); p.view.setProgress(0, 0, false, performance.now());
  }
  setLegend(p);
}

/* ============================== settings & share ============================== */
function onSettings(values, key) {
  if (!ready) return;
  if (key === "showWords" || key === null) layout();
  if (key === "teluguDigits" || key === null) KEYS.forEach(k => refreshStatic(P[k]));
  if (key === "reduceFx" || key === null) KEYS.forEach(k => P[k].view?.applyFx());
  if (key === "speed") KEYS.forEach(k => { if (visibleNow(k)) replay(k); });
  kick();
}
function doShare() {
  const parts = KEYS.filter(k => k === "padyarchana" || app.settings.showWords)
    .map(k => { const d = P[k].data; return `${PROJECTS[k].name}: ${num(d.current)} / ${num(d.target)} ${PROJECTS[k].unit} (${pctText(d.current / d.target)})`; });
  const url = new URL(location.href);
  for (const q of ["debug", "q"]) url.searchParams.delete(q);
  share({ title: "తెలుగు సంపద", text: `తెలుగు సంపద · ${parts.join(" · ")}`, url: url.toString() }, app.toast);
}

/* ============================== boot ============================== */
// fontsReady() loads only the Telugu subset; the 3D labels also need its Latin digits
const latinDigits = document.fonts ? Promise.race([document.fonts.load("700 48px 'Noto Sans Telugu'", "0123456789,.%").catch(() => null), new Promise(r => setTimeout(r, 3000))]) : null;
const [loaded] = await Promise.all([loadData(), fontsReady(), latinDigits]);
Object.assign(store, loaded);
for (const k of KEYS) P[k].data = store[k];
ready = true;
createView("padyarchana");
KEYS.forEach(k => { if (!P[k].unitSize) P[k].unitSize = niceUnit(P[k].data.target / (k === "padyarchana" ? DROP_BUDGET : LEAF_BUDGET)); refreshStatic(P[k]); });
layout();
if (DEBUG) window.__dash = {
  P, store, tier, loop, replay, layout,
  snapshot: () => Object.fromEntries(KEYS.map(k => [k, { e: P[k].e, text: P[k].el.now.textContent, shown: P[k].shown, fill: P[k].view?.fill ?? null,
    leaves: P[k].view?.leavesShown ?? null, unit: P[k].unitSize, current: P[k].data.current, target: P[k].data.target, onscreen: P[k].onscreen, t0: P[k].anim.t0, dur: P[k].anim.dur }])),
};
</script>
</body>
