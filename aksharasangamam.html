<script type="module">

    else if (axis === "up" && -dy > 40 && (fast(recent) || fast(overall))) holdSwap();                            // flick up
  },
  onTap: () => { if (state.mode === "playing") rotate(1); },
});
keyControls({
  ArrowLeft: () => press(-1), KeyA: () => press(-1),
  ArrowRight: () => press(1), KeyD: () => press(1),
  ArrowUp: () => rotate(1), KeyX: () => rotate(1), KeyW: () => rotate(1), KeyZ: () => rotate(-1),
  ArrowDown: () => softOn(), KeyS: () => softOn(),
  " ": () => hardDrop(),
  KeyC: () => holdSwap(),
  KeyP: () => togglePause(), Escape: () => togglePause(),
});
window.addEventListener("keyup", e => {
  if (e.code === "ArrowLeft" || e.code === "KeyA") release(-1);
  if (e.code === "ArrowRight" || e.code === "KeyD") release(1);
  if (e.code === "ArrowDown" || e.code === "KeyS") softOff();
});
window.addEventListener("blur", releaseAll);

/* ============================== boot ============================== */
applyPads();
layout.classList.toggle("no-colors", !app.settings.colors);
state.cfg = { ...app.settings };
applyConfig(state.cfg);
autoResize({ renderer, camera, composer, bloomPass, container: app.stage, onResize: () => { relayout(); fit(); } });
new ResizeObserver(() => fit()).observe(well);
// Compile the ghost and outline shaders now (out of sight) so the first falling piece doesn't hitch.
m4.makeTranslation(0, 5, -1.2); ghost.setMatrixAt(0, m4); ghost.count = 1; ghost.visible = true;   // buried in the back wall
ghostLines[0].position.set(0, 5, -1.2); ghostLines[0].visible = true;
composer.render();
ghost.visible = false; ghostLines[0].visible = false;
ready = true;
showMenu();
loop.start();

if (DEBUG) {
  const L = v => (typeof v === "number" ? state.pool[v] : v);
  window.__game = {
    state, view, input,
    get board() { return board; },
    /** rows: strings (top → bottom) placed at the bottom of the board; '.' empty, 0-9a-z = index into `letters` (default: the pool). */
    setBoard(rows, letters = state.pool) {
      board = emptyBoard();
      rows.forEach((row, i) => { const r = H - rows.length + i; [...row].forEach((ch, c) => { if (ch !== "." && c < W) board[r][c] = { letter: letters[parseInt(ch, 36)], fall: 0, land: 0, clear: false }; }); });
    },
    setLetters: () => state.setLetters,
    /** Fill all but the top `free` rows with two alternating letters (no runs). */
    fillJunk(free = 2) {
      for (let r = free; r < H; r++) for (let c = 0; c < W; c++) board[r][c] = { letter: state.pool[(r + c) % 2], fall: 0, land: 0, clear: false };
    },
    /** Replace the falling piece: letters fill its blocks in reading order (numbers = pool index). */
    setPiece(shape, letters, { x = null, rot = 0 } = {}) {
      let k = 0;
      let m = SHAPES[shape].map(row => row.map(v => (v ? L(letters[k++ % letters.length]) : null)));
      for (let i = 0; i < rot; i++) m = rotCW(m);
      const top = m.findIndex(r => r.some(Boolean));
      const p = { shape, m, rot, x: x ?? Math.floor(W / 2) - Math.floor(m.length / 2), y: -top, lockT: 0, resets: 0, lowest: -top, spin: 0 };
      p.vx = p.x; p.vy = p.y;
      state.piece = p; state.mode = "playing";
    },
    setChains(n) { state.chains = n; renderHud(); },
    info: () => ({
      mode: state.mode, score: state.score, chains: state.chains, level: state.level, combo: state.combo, maxCombo: state.maxCombo,
      dropInterval: state.dropInterval, pool: state.pool, W, H, cellPx: view.cellPx, slot: view.slot, hold: state.hold?.shape ?? null,
      next: state.next?.shape ?? null, canHold: state.canHold,
      piece: state.piece && { shape: state.piece.shape, x: state.piece.x, y: state.piece.y, rot: state.piece.rot, m: state.piece.m },
      rows: board.map(row => row.map(c => (c ? (state.pool.includes(c.letter) ? String(state.pool.indexOf(c.letter)) : "?") : ".")).join("")),
      calls: state.calls, gt: state.gt,
    }),
  };
}
</script>
