<script type="module">
import { createApp, createLoop, pointerControls, keyControls, fontsReady, haptic, isTouch, params, prefersReducedMotion } from "tt/shell.js";
import { el, setChildren, icon } from "tt/safe.js";
import { sfx, speak, canSpeakTelugu } from "tt/sfx.js";
import * as te from "tt/telugu.js";
import { THREE, createRenderer, createComposer, autoResize, composerColor, glyphTexture, Burst, voxelMesh, dotTexture, qualityTier } from "tt/three-kit.js";

/* ============================== tuning ============================== */
const DEBUG = params().has("debug");
const tier = qualityTier();
const SEED = params().has("seed") ? +params().get("seed") : Date.now() >>> 0;
const rand = te.rng(SEED);                // mazes + letters (reproducible with ?seed=)
const ai = te.rng(SEED ^ 0x5bd1e995);     // chaser decisions
const REDUCED = prefersReducedMotion();
const VS = 0.2;                 // wall voxel size: one maze cell = 5 voxels = 1 world unit
const PLAYER_SPEED = 3.6;       // cells per second (fixed timestep → same at 60/120 Hz)
const INVULN = 2.2;             // seconds of blinking safety after losing a life
const PITCH = THREE.MathUtils.degToRad(62);
const SIZES = { small: [6, 8], medium: [7, 10], large: [9, 12] };   // columns × rows; +1 every two levels
const MAX_DIM = [10, 13];
const DIFF = {
  easy:   { speed: 2.0, ramp: 0.10, chase: 0.25, ghosts: 2 },
  normal: { speed: 2.5, ramp: 0.12, chase: 0.45, ghosts: 2 },
  hard:   { speed: 3.0, ramp: 0.12, chase: 0.65, ghosts: 3 },
};
// Full aksharas only — the original also dropped bare vowel signs, ం ః and ్ into the field; never again.
const UNIVERSE = [...te.VOWELS, ...te.CONSONANTS];
const LOOKALIKE_LETTERS = [...new Set(te.LOOKALIKES.flat())].filter(c => UNIVERSE.includes(c));
const GHOST_COLORS = ["#ff4d6d", "#38d6e8", "#ff8ad8", "#ffa63d"];
const PALETTES = [   // ఉదయం → మధ్యాహ్నం → సంధ్య → రాత్రి, one per level
  { bg: "#3f7f35", hemiSky: "#ffffff", hemiGround: "#7a9a4a", hemi: 1.45, sun: "#fff3dc", sunI: 1.75, night: 0, theme: "hedge" },
  { bg: "#4f7a30", hemiSky: "#fff1d8", hemiGround: "#8a7a4a", hemi: 1.4, sun: "#ffd9a0", sunI: 1.8, night: 0.1, theme: "fort" },
  { bg: "#2c2440", hemiSky: "#ffb48a", hemiGround: "#4a3346", hemi: 1.15, sun: "#ff9a5a", sunI: 1.3, night: 0.55, theme: "hedge" },
  { bg: "#0b1030", hemiSky: "#8a96ff", hemiGround: "#1d2238", hemi: 0.85, sun: "#a8b8ff", sunI: 0.6, night: 1, theme: "fort" },
];
const THEMES = {
  hedge: { body: ["#2f7d32", "#378c3a", "#2a7030"], top: ["#5cb653", "#4fa548", "#6cc261"], post: ["#cdb48a", "#bfa57a"],
           cap: ["#ff7fb0", "#f2d65c", "#b99cff", "#ffa040"], floor: ["#e9d7a9", "#e2cf9e", "#dcc794"], speck: ["#cdb784", "#f3e4bd"], grout: "#c2aa78" },
  fort:  { body: ["#d39a5f", "#c98a4f", "#dba86e"], top: ["#ecc489", "#e8b97a", "#f2cf98"], post: ["#a8703f", "#9a6536"],
           cap: ["#ffd34d", "#ffc233"], floor: ["#c7bfae", "#bdb5a3", "#d0c9b9"], speck: ["#aaa190", "#ddd6c8"], grout: "#9a907e" },
};

/* ============================== app shell ============================== */
const SETTINGS = [
  { key: "target", label: "వేటాడే అక్షరాలు", type: "segmented", default: "mix", restart: true,
    help: "మిశ్రమం: ప్రతి స్థాయిలో ఒక కొత్త గుంపు, మధ్యమధ్యలో ఒక్క అక్షరం వేట",
    options: [{ value: "mix", label: "మిశ్రమం" }, ...Object.entries(te.GROUPS).map(([value, g]) => ({ value, label: g.te }))] },
  { key: "size", label: "చిక్కుదారి పరిమాణం", type: "segmented", default: "small", restart: true,
    options: [{ value: "small", label: "చిన్నది" }, { value: "medium", label: "మధ్యస్థం" }, { value: "large", label: "పెద్దది" }] },
  { key: "difficulty", label: "భూతాల వేగం", type: "segmented", default: "normal", restart: true,
    options: [{ value: "easy", label: "సులభం" }, { value: "normal", label: "మామూలు" }, { value: "hard", label: "కష్టం" }] },
  { key: "lives", label: "ప్రాణాలు", type: "segmented", default: 3, restart: true, options: [{ value: 3, label: "3" }, { value: 5, label: "5" }] },
  { key: "dpad", label: "దిశ బటన్లు", type: "toggle", default: isTouch(), help: "▲ ◀ ▶ ▼ బటన్లు చూపించు (తెరపై స్వైప్ ఎప్పుడూ పనిచేస్తుంది)" },
  { key: "speak", label: "అక్షరాన్ని పలుకు", type: "toggle", default: true, help: "వేటాడాల్సిన అక్షరాన్ని వినిపిస్తుంది (పరికరంలో తెలుగు స్వరం ఉంటేనే)" },
];
const helpNode = () => el("div", { class: "intro" },
  el("p", { text: "• పైన చూపిన గుంపులోని (ఉదా: క వర్గం) లేదా పైన చూపిన అక్షరాన్ని మాత్రమే తినండి. అవన్నీ తింటే తదుపరి స్థాయి!" }),
  el("p", { text: "• తప్పు అక్షరం తిన్నా, భూతం తగిలినా ఒక ప్రాణం పోతుంది. మెరుస్తున్నంతసేపు మీకు రక్షణ ఉంటుంది." }),
  el("p", { text: "• ప్రతి సరైన అక్షరం +10. స్థాయి పూర్తి చేస్తే బోనస్. ప్రతి స్థాయికి చిక్కుదారి పెద్దదవుతుంది, భూతాలు వేగం పెంచుతాయి." }),
  el("p", { class: "ctl", text: "ఫోన్: తెరపై స్వైప్ చేయండి లేదా దిశ బటన్లు · కీబోర్డ్: ← ↑ → ↓ లేదా W A S D · ఆపడానికి P" }),
);
const app = createApp({ id: "aksharaveta", title: "అక్షరాల వేట", accent: "leaf", game: true, settings: SETTINGS, help: helpNode,
  onSettings: (v, key) => {
    if (key === "dpad" || key === null) { pad.hidden = !v.dpad; relayout(); }
    if (key === "speak" || key === null) renderTarget();
    if (state.mode === "menu" && (key === null || SETTINGS.find(f => f.key === key)?.restart)) {   // keep the menu preview in sync
      state.cfg = { ...v }; state.maxLives = state.lives = v.lives; setupLevel(1); showMenu();
    }
  } });
app.addAction("pause", "ఆపు", () => togglePause());

/* ---------- HUD (DOM) ---------- */
const targetEl = el("div", { class: "target", attrs: { role: "status", "aria-live": "polite" } });
const livesPill = el("span", { class: "tt-pill hearts" });
const scorePill = el("span", { class: "tt-pill" });
const leftPill = el("span", { class: "tt-pill" });
const hud = el("div", { class: "hud" }, targetEl, el("div", { class: "stats" }, livesPill, scorePill, leftPill));
const banner = el("div", { class: "banner", hidden: true, attrs: { "aria-live": "assertive" } });
const flash = el("div", { class: "flash" });
const PAD_DIRS = [["up", "▲", "పైకి"], ["left", "◀", "ఎడమకు"], ["right", "▶", "కుడికి"], ["down", "▼", "కిందికి"]];
const pad = el("div", { class: "tt-pad dpad", hidden: !app.settings.dpad, attrs: { role: "group", "aria-label": "దిశ బటన్లు" } },
  PAD_DIRS.map(([d, t, label]) => el("button", { type: "button", class: d, text: t, attrs: { "aria-label": label },
    on: { pointerdown: e => { e.preventDefault(); input(d); }, click: e => { if (e.detail === 0) input(d); } } })));
app.stage.append(hud, flash, banner, pad);

/* ============================== 3D world ============================== */
await fontsReady();
const renderer = createRenderer({ container: app.stage, tier, exposure: 1.0 });
if (!renderer) throw new Error("WebGL unavailable");   // createRenderer already showed a Telugu message
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 500);
scene.background = composerColor(PALETTES[0].bg);
const hemi = new THREE.HemisphereLight(0xffffff, 0x7a9a4a, 1.45);
const sun = new THREE.DirectionalLight(0xffffff, 1.75);
sun.position.set(-5, 10, 6);    // front-left of the portrait camera, so the faces you see are lit
scene.add(hemi, sun);
// threshold above lit surfaces: only glowing letters, halos, lamps and sparks bloom
const { composer, bloomPass } = createComposer(renderer, scene, camera, { bloom: { strength: 0.6, radius: 0.45, threshold: 0.92 } });

function pixelTex(canvas, { repeat = null } = {}) {
  const t = new THREE.CanvasTexture(canvas);
  t.colorSpace = THREE.SRGBColorSpace; t.magFilter = THREE.NearestFilter; t.anisotropy = 4;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat, repeat); }
  return t;
}
function canvas2d(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; return [c, c.getContext("2d")]; }

/* ---------- lawn around the maze ---------- */
const grassTex = (() => {
  const [c, g] = canvas2d(32, 32), r = te.rng(6);
  g.fillStyle = "#4f9a3a"; g.fillRect(0, 0, 32, 32);
  for (let i = 0; i < 230; i++) { g.fillStyle = r() < 0.5 ? "#458d33" : "#5cab45"; g.fillRect(r() * 32 | 0, r() * 32 | 0, 1, 2); }
  for (const [x, y, col] of [[5, 7, "#e6c84a"], [22, 4, "#e58ab4"], [14, 24, "#d9d2f0"], [27, 19, "#e6c84a"]]) { g.fillStyle = col; g.fillRect(x, y, 2, 2); }
  return pixelTex(c, { repeat: 110 });
})();
const lawn = new THREE.Mesh(new THREE.PlaneGeometry(220, 220).rotateX(-Math.PI / 2), new THREE.MeshLambertMaterial({ map: grassTex }));
lawn.position.y = -0.01;
scene.add(lawn);

/* ---------- voxel helpers ---------- */
/** Recolour the front-most voxel (largest z) of each (x, y) column — eyes on a round face. */
function paintFront(list, cols, color) {
  for (const [x, y] of cols) {
    let best = null;
    for (const v of list) if (v.x === x && v.y === y && (!best || v.z > best.z)) best = v;
    if (best) best.color = color;
  }
}
const blobGeo = new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2);
const blobMat = new THREE.MeshBasicMaterial({ map: dotTexture(), color: 0x000000, transparent: true, opacity: 0.4, depthWrite: false });
const blob = s => { const m = new THREE.Mesh(blobGeo, blobMat); m.scale.set(s, 1, s); m.position.y = 0.012; return m; };

/* ---------- the chomper: a round voxel creature whose two halves open like a mouth ---------- */
const CS = 0.085;
function chomperVoxels() {
  const top = [], bot = [], feet = [];
  for (let x = -4; x < 4; x++) for (let y = -4; y < 4; y++) for (let z = -4; z < 4; z++) {
    const px = x + 0.5, py = y + 0.5, pz = z + 0.5;
    if (px * px + py * py + pz * pz > 17.2) continue;
    const inner = (y === 0 || y === -1) && px * px + pz * pz < 9.5;   // inside of the mouth, seen only when open
    let color = (x + y + z) & 1 ? "#ffd23f" : "#ffc52b";
    if (inner) color = y === -1 && pz > 0 && Math.abs(px) < 2 ? "#ff6f91" : "#7a1d2e";
    (y >= 0 ? top : bot).push({ x, y, z, color });
  }
  paintFront(top, [[-2, 1], [-2, 2], [1, 1], [1, 2]], "#1b1b22");                 // eyes
  top.push({ x: -1, y: 4, z: -1, color: "#2e7d32" }, { x: -1, y: 5, z: -1, color: "#2e7d32" },   // a little leaf sprout
    { x: 0, y: 5, z: -1, color: "#34d17e" }, { x: 0, y: 6, z: -1, color: "#34d17e" }, { x: -2, y: 6, z: -1, color: "#5fe39a" });
  for (const fx of [-3, -2, 1, 2]) for (const fz of [0, 1]) feet.push({ x: fx, y: -5, z: fz, color: "#ff8a3d" });
  return { top, bot, feet };
}
const creatureGlow = [];   // materials lifted at dusk/night so the hero and chasers stay readable
const hero = new THREE.Group();
const heroBody = new THREE.Group();
heroBody.position.y = 5 * CS;                  // sphere centre: radius 4 voxels + 1 voxel of feet
const jawTop = new THREE.Group(), jawBot = new THREE.Group();
jawTop.position.z = jawBot.position.z = -4 * CS;   // hinge at the back of the head

    const px = (_v.x + 1) / 2 * W, py = (1 - _v.y) / 2 * H;
    b.x0 = Math.min(b.x0, px); b.x1 = Math.max(b.x1, px); b.y0 = Math.min(b.y0, py); b.y1 = Math.max(b.y1, py);
  }
  return b;
}
function mazeCorners() {
  const hw = state.maze.W / 2 + 0.12, hh = state.maze.H / 2 + 0.12, pts = [];
  for (const x of [-hw, hw]) for (const z of [-hh, hh]) for (const y of [0, 1.0]) pts.push(new THREE.Vector3(x, y, z));

function solveFit(yaw, W, H, fw, fh, pts) {

    const mid = (lo + hi) / 2; placeCam(fitCam, yaw, mid);
    const b = projBounds(fitCam, pts, W, H);

function freeRect(W, H) {
  const sr = app.stage.getBoundingClientRect(), side = app.stage.classList.contains("is-side");
  let x0 = 8, y0 = Math.max(8, app.topbar.getBoundingClientRect().bottom - sr.top + 2), x1 = W - 8, y1 = H - 8;
  const hr = hud.getBoundingClientRect();
  if (side) x0 = Math.max(x0, hr.right - sr.left + 8); else y0 = Math.max(y0, hr.bottom - sr.top + 6);
  if (!pad.hidden) {
    const pr = pad.getBoundingClientRect();
    if (app.stage.classList.contains("pad-right")) x1 = Math.min(x1, pr.left - sr.left - 8); else y1 = Math.min(y1, pr.top - sr.top - 8);

function fitCamera() {
  if (!state.maze) return;
  const W = app.stage.clientWidth, H = app.stage.clientHeight;
  if (!W || !H) return;
  const f = rig.free = freeRect(W, H), fw = (f.x1 - f.x0) * 0.97, fh = (f.y1 - f.y0) * 0.97, pts = mazeCorners();
  const a = solveFit(0, W, H, fw, fh, pts), b = solveFit(Math.PI / 2, W, H, fw, fh, pts);
  const [keep, other] = rig.yaw === 0 ? [a, b] : [b, a];
  const pick = other.d < keep.d * 0.95 ? other : keep;    // a little hysteresis so the view doesn't flip-flop
  rig.yaw = pick.yaw; rig.d = pick.d;

  rig.base.copy(camera.position);
  // shift the image (not the perspective) so the maze sits in the middle of the free area
  const fx = (f.x0 + f.x1) / 2, fy = (f.y0 + f.y1) / 2;
  camera.setViewOffset(W, H, (pick.b.x0 + pick.b.x1) / 2 - fx, (pick.b.y0 + pick.b.y1) / 2 - fy, W, H);
  banner.style.left = `${fx}px`; banner.style.top = `${fy}px`;
}
function relayout() {
  const w = app.stage.clientWidth, h = app.stage.clientHeight;
  app.stage.classList.toggle("is-side", w > h && h < 560);
  app.stage.classList.toggle("pad-right", w > h);
  document.documentElement.classList.toggle("toast-high", !pad.hidden && w <= h);
  document.documentElement.style.setProperty("--av-pad-h", `${pad.offsetHeight || 0}px`);   // toasts sit just above the D-pad
  fitCamera();
}
// screen direction ↔ maze direction for the two camera orientations (portrait: north is up; landscape: east is up)
const SCREEN_TO_WORLD = [{ up: "N", down: "S", left: "W", right: "E" }, { up: "E", down: "W", left: "N", right: "S" }];
const screenToWorld = sd => SCREEN_TO_WORLD[rig.yaw ? 1 : 0][sd];
const worldToScreen = wd => Object.entries(SCREEN_TO_WORLD[rig.yaw ? 1 : 0]).find(([, w]) => w === wd)[0];

/* ============================== events ============================== */
function eat(L) {
  const at = cellWorld(L.cx, L.cy); at.y = 0.6;
  if (L.target) {
    L.eaten = true; L.anim = { t: 0, good: true };
    state.targetsLeft--; state.score += 10; state.eaten.push(L.ch); state.mouthPhase = 0;
    sfx.play("coin"); haptic(10);
    burst.emit(at, { count: REDUCED ? 20 : 46, color: 0xffd34d, speed: 4.2, gravity: -5, life: 0.8 });
    if (app.settings.speak) speak(L.ch);
    renderStats(); pop(scorePill);
    if (state.targetsLeft <= 0) levelDone();
    return;
  }
  if (state.invuln > 0) { state.graceCell = L.i; return; }   // protected: walk past it
  L.eaten = true; L.anim = { t: 0, good: false };
  burst.emit(at, { count: REDUCED ? 16 : 36, color: 0xff4d6d, speed: 3.6, gravity: -4, life: 0.7 });
  app.toast(`"${L.ch}" తప్పు అక్షరం! వేటాడాల్సింది: ${state.plan.label}`, { tone: "bad", ms: 2000 });
  hurt("letter");
}
function hurt(kind) {
  state.lives--; state.invuln = INVULN;
  state.shake = REDUCED ? 0 : 0.35;
  flash.classList.add("on"); requestAnimationFrame(() => requestAnimationFrame(() => flash.classList.remove("on")));
  sfx.play(kind === "ghost" ? "crash" : "bad"); haptic([40, 30, 60]);
  if (kind === "ghost") app.toast("భూతం పట్టుకుంది! జాగ్రత్త!", { tone: "bad", ms: 1600 });
  burst.emit(new THREE.Vector3(state.heroCur.x, 0.5, state.heroCur.z), { count: REDUCED ? 16 : 40, color: kind === "ghost" ? 0xffffff : 0xff4d6d, speed: 4 });
  renderStats(); pop(livesPill);
  if (state.lives <= 0) {
    state.mode = "over"; state.deathT = 0;
    const run = state.run;
    setTimeout(() => { if (state.run === run && state.mode === "over") gameOver(); }, 1100);
  }
}
function levelDone() {
  state.mode = "levelDone";
  const bonus = 50 * state.level;
  state.score += bonus;
  renderStats(); sfx.play("level"); haptic([20, 40, 20]);
  burst.emit(new THREE.Vector3(state.heroCur.x, 0.6, state.heroCur.z), { count: REDUCED ? 40 : 140, color: 0x34d17e, speed: 6 });
  const run = state.run, eaten = [...state.eaten];
  setTimeout(() => {
    if (state.run !== run || state.mode !== "levelDone") return;
    app.overlay({
      title: "భలే!",
      body: el("div", {}, el("div", { class: "done-big", text: "అక్షరాలు పూర్తయ్యాయి!" }),
        el("p", { class: "done-note", text: `వేటాడినవి: ${state.plan.label}` }),
        el("div", { class: "done-syls" }, eaten.map(c => el("span", { text: c })))),
      stats: [{ label: "స్కోరు", value: state.score.toLocaleString("en-IN") }, { label: "బోనస్", value: `+${bonus}` }, { label: "ప్రాణాలు", value: String(state.lives) }],
      actions: [{ label: "తదుపరి స్థాయి →", onClick: nextLevel }],
    });
  }, 900);
}
function gameOver() {
  const key = `${state.cfg.target}-${state.cfg.difficulty}`;
  const { best, isNew } = app.best(key).submit(state.score);
  app.overlay({
    title: "ఆట ముగిసింది!", body: isNew ? "కొత్త రికార్డు! 🎉" : `స్థాయి ${state.level} వరకు వచ్చారు.`,
    stats: [{ label: "స్కోరు", value: state.score.toLocaleString("en-IN") }, { label: "ఉత్తమం", value: best.toLocaleString("en-IN") }, { label: "స్థాయి", value: String(state.level) }],
    actions: [{ label: "మళ్ళీ ఆడు", onClick: startGame }, { label: "అమరికలు", ghost: true, onClick: app.openSettings }],
  });
}

/* ============================== flow ============================== */
function beginReady() {
  state.mode = "ready"; state.readyT = 1.5; showBanner("సిద్ధం!"); sfx.play("tick");
  setTimeout(sayTarget, 250);
}
function startGame() {
  const fromMenu = state.mode === "menu";     // the menu already shows level 1 (maze + target): play exactly that
  state.cfg = { ...app.settings };
  state.maxLives = state.lives = state.cfg.lives;
  state.score = 0;
  app.hideOverlay();
  if (fromMenu) { state.run++; renderStats(); } else { state.lastGroup = null; state.lastLetter = null; setupLevel(1); }
  beginReady();
  loop.start();
}
function nextLevel() { app.hideOverlay(); setupLevel(state.level + 1); beginReady(); }
function togglePause() {
  if (state.mode === "paused") return resume();
  if (!["playing", "ready"].includes(state.mode)) return;
  state.pausedFrom = state.mode; state.mode = "paused";
  app.overlay({ title: "ఆట ఆగింది", actions: [
    { label: "కొనసాగించు", onClick: resume },
    { label: "మళ్ళీ మొదలు", ghost: true, onClick: startGame },
    { label: "అమరికలు", ghost: true, onClick: app.openSettings },
  ] });
}
function resume() { if (state.mode !== "paused") return; state.mode = state.pausedFrom; app.hideOverlay(); loop.start(); }
function showMenu() {
  state.mode = "menu"; banner.hidden = true;
  const lbl = k => SETTINGS.find(f => f.key === k).options.find(o => o.value === app.settings[k])?.label;
  app.overlay({
    title: "అక్షరాల వేట",
    body: el("div", { class: "intro" },
      el("p", { text: "చిక్కుదారిలో తిరుగుతూ పైన చూపిన అక్షరాలను మాత్రమే తినండి!" }),
      el("p", { text: "తప్పు అక్షరం తిన్నా, భూతం తగిలినా ఒక ప్రాణం పోతుంది." }),
      el("p", { class: "ctl", text: isTouch() ? "తెరపై స్వైప్ చేయండి లేదా దిశ బటన్లు నొక్కండి" : "← ↑ → ↓ బాణం కీలు లేదా W A S D" }),
      el("small", { text: `తెలుగు తునకలు · ${lbl("target")} · ${lbl("size")} · ${lbl("difficulty")}` })),
    actions: [{ label: "ఆట ప్రారంభించు", onClick: startGame }, { label: "అమరికలు", ghost: true, onClick: app.openSettings }],
  });
}
function input(sd) {
  if (state.mode !== "playing" && state.mode !== "ready") return;
  state.player.want = screenToWorld(sd);
}

/* ============================== simulation ============================== */
const facingOf = d => Math.atan2(DIRS[d].dx, DIRS[d].dy);   // models face +z
const angleTo = (a, b) => { let d = (b - a) % (Math.PI * 2); if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2; return d; };
function updatePlayer(dt) {
  const P = state.player, mz = state.maze;
  if (P.want && P.dir && P.want !== P.dir) {
    if (P.want === DIRS[P.dir].opp) reverse(P);                                              // reversing is always allowed
    else if (P.t < 0.15 && mz.canGo(P.from.x, P.from.y, P.want)) { P.t = 0; P.dir = P.want; }  // just missed the turn: forgive
  }
  stepMover(P, PLAYER_SPEED * dt, playerDecide);
  const pos = moverPos(P), cx = Math.round(pos.x), cy = Math.round(pos.y), ci = mz.idx(cx, cy);
  if (ci !== state.playerCell) { state.playerCell = ci; state.dist = bfs(mz, cx, cy); if (ci !== state.graceCell) state.graceCell = -1; }
  if (Math.abs(pos.x - cx) + Math.abs(pos.y - cy) < 0.4) {
    const L = state.letterAt.get(ci);
    if (L && !L.eaten && state.graceCell !== ci) eat(L);
  }
}
function updateGhosts(dt) {
  const pp = moverPos(state.player);
  for (const g of ghosts) {
    if (!g.active) continue;
    if (g.wait > 0) g.wait -= dt;
    else if (!state.frozen) { stepMover(g.m, g.speed * dt, ghostDecide); g.travel += g.speed * dt; }
    const gp = moverPos(g.m);
    if (state.mode === "playing" && state.invuln <= 0 && Math.hypot(gp.x - pp.x, gp.y - pp.y) < 0.62) {
      hurt("ghost");
      if (g.m.dir) reverse(g.m);
    }
  }
}
function update(dt) {
  if (state.mode === "paused") return;
  state.t += dt;
  state.heroPrev.copy(state.heroCur);
  for (const g of ghosts) g.prev.copy(g.cur);

  if (state.mode === "ready") {
    state.readyT -= dt;
    if (state.readyT <= 0.4 && banner.textContent !== "పద!") { showBanner("పద!"); sfx.play("whoosh"); }
    if (state.readyT <= 0) { state.mode = "playing"; banner.hidden = true; }
  }
  if (state.mode === "playing") {
    state.invuln = Math.max(0, state.invuln - dt);
    updatePlayer(dt);
    if (state.mode === "playing") updateGhosts(dt);
  }

  // positions (rendered with interpolation)
  if (state.maze) {
    const p = moverPos(state.player);
    cellWorld(p.x, p.y, state.heroCur);
    for (const g of ghosts) if (g.active) { const q = moverPos(g.m); cellWorld(q.x, q.y, g.cur); }
  }

  // hero: face the way it moves, chomp while moving, blink while protected, spin away when out of lives
  const P = state.player;
  if (P?.dir) state.facing += angleTo(state.facing, facingOf(P.dir)) * Math.min(1, dt * 16);
  hero.rotation.y = state.facing;
  const moving = state.mode === "playing" && !!P?.dir;
  if (moving) { state.mouthPhase += dt * 15; state.mouth = (0.5 - 0.5 * Math.cos(state.mouthPhase)) * 0.62; }
  else state.mouth += ((state.mode === "menu" ? 0.25 + 0.2 * Math.sin(state.t * 3) : 0.12) - state.mouth) * Math.min(1, dt * 8);
  jawTop.rotation.x = -state.mouth; jawBot.rotation.x = state.mouth * 0.55;
  heroBody.position.y = 5 * CS + (moving && !REDUCED ? Math.abs(Math.sin(state.mouthPhase * 0.5)) * 0.04 : 0);
  if (state.mode === "over") {
    state.deathT += dt;
    hero.scale.setScalar(Math.max(0.01, 1 - state.deathT * 0.9));
    if (!REDUCED) hero.rotation.y = state.facing + state.deathT * 9;
    hero.visible = true;
  } else hero.visible = state.invuln <= 0 || Math.floor(state.t * 12) % 2 === 0;

  // chasers
  for (const g of ghosts) {
    if (!g.active) continue;
    const want = g.m?.dir ? facingOf(g.m.dir) : 0;
    g.group.rotation.y += angleTo(g.group.rotation.y, want) * Math.min(1, dt * 10);
    g.body.position.y = 0.04 + (REDUCED ? 0 : Math.sin(state.t * 5 + g.phase) * 0.04);
  }

  // letters: gentle bob; eaten ones pop (right) or flush red and sink (wrong)
  for (const L of state.letters) {
    if (L.anim) {
      L.anim.t += dt;
      const k = Math.min(1, L.anim.t / 0.35);
      L.s.material.opacity = 1 - k; L.halo.visible = false;
      if (L.anim.good) { L.s.position.y = 0.62 + k * 0.5; L.s.scale.setScalar(0.8 * (1 + k * 0.6)); L.s.scale.x *= L.s.material.map.userData.aspect; }
      else { L.s.material.color.set(0xff5a6a); L.s.position.y = 0.62 - k * 0.4; L.s.position.x = REDUCED ? 0 : Math.sin(L.anim.t * 60) * 0.06 * (1 - k); }
      if (k >= 1) { L.g.visible = false; L.anim = null; }
    } else if (!L.eaten && !REDUCED) {
      L.s.position.y = 0.62 + Math.sin(state.t * 2.4 + L.phase) * 0.035;
      L.halo.scale.setScalar(1.3 + Math.sin(state.t * 3 + L.phase) * 0.12);
    }
  }

  // night: fireflies
  if (!REDUCED && pal.night > 0.4 && state.maze && state.t > state.nextFly) {
    state.nextFly = state.t + 0.18;
    burst.emit(new THREE.Vector3((Math.random() - 0.5) * state.maze.W, 0.3 + Math.random() * 0.6, (Math.random() - 0.5) * state.maze.H),
      { count: 1, color: 0xd8ff7a, speed: 0.25, gravity: 0.15, life: 2.2 });
  }
  burst.update(dt);
  stepPalette(dt);
  state.shake = Math.max(0, state.shake - dt * 1.4);
}
function render(dt, alpha) {
  const k = state.mode === "paused" ? 1 : alpha;
  hero.position.lerpVectors(state.heroPrev, state.heroCur, k);
  for (const g of ghosts) if (g.active) g.group.position.lerpVectors(g.prev, g.cur, k);
  const s = state.shake * state.shake;
  camera.position.copy(rig.base);
  if (s > 0) camera.position.add(_v.set((Math.random() - 0.5) * s, (Math.random() - 0.5) * s, (Math.random() - 0.5) * s));
  composer.render();
}
const loop = createLoop({ update, render, onHidden: () => { if (["playing", "ready"].includes(state.mode)) togglePause(); } });
document.addEventListener("visibilitychange", () => { if (!document.hidden && state.mode !== "paused") loop.start(); });

/* ============================== input ============================== */
// swipe anywhere: a direction fires as soon as the finger has moved ~22 px, and again for every new stroke
let anchor = null;
pointerControls(app.stage, {
  onDragStart: () => { anchor = { x: 0, y: 0 }; },
  onDrag: ({ dx, dy }) => {
    if (!anchor) return;
    const ax = dx - anchor.x, ay = dy - anchor.y;
    if (Math.hypot(ax, ay) < 22) return;
    input(Math.abs(ax) > Math.abs(ay) ? (ax > 0 ? "right" : "left") : (ay > 0 ? "down" : "up"));
    anchor = { x: dx, y: dy };
  },
  onDragEnd: () => { anchor = null; },
});
keyControls({
  ArrowUp: () => input("up"), KeyW: () => input("up"), ArrowDown: () => input("down"), KeyS: () => input("down"),
  ArrowLeft: () => input("left"), KeyA: () => input("left"), ArrowRight: () => input("right"), KeyD: () => input("right"),
  KeyP: togglePause, Escape: togglePause,
});
window.speechSynthesis?.addEventListener?.("voiceschanged", renderTarget);

/* ============================== boot ============================== */
state.cfg = { ...app.settings };
state.maxLives = state.lives = state.cfg.lives;
setupLevel(1);
autoResize({ renderer, camera, composer, bloomPass, container: app.stage, onResize: relayout });
new ResizeObserver(() => fitCamera()).observe(hud);
showMenu();
loop.start();

if (DEBUG) {
  const teleport = (x, y) => {
    state.player = mover(x, y); cellWorld(x, y, state.heroCur); state.heroPrev.copy(state.heroCur);
    state.playerCell = state.maze.idx(x, y); state.dist = bfs(state.maze, x, y);
  };
  window.__game = {
    state, ghosts, startGame, togglePause, teleport,
    get yaw() { return rig.yaw; },
    freeze(on = true) { state.frozen = on; },
    pos: () => moverPos(state.player),
    /** Put the hero next to an uneaten target/wrong letter; returns the screen direction that walks into it. */
    approach(kind) {
      const mz = state.maze;
      for (const L of state.letters) {
        if (L.eaten || L.target !== (kind === "target")) continue;
        for (const d of DIR_KEYS) {
          const nx = L.cx - DIRS[d].dx, ny = L.cy - DIRS[d].dy;
          if (!mz.inside(nx, ny) || !mz.canGo(nx, ny, d) || state.letterAt.get(mz.idx(nx, ny))?.eaten === false) continue;
          if (ghosts.some(g => g.active && Math.hypot(moverPos(g.m).x - nx, moverPos(g.m).y - ny) < 1.5)) continue;
          teleport(nx, ny);
          return { dir: worldToScreen(d), ch: L.ch, cell: [L.cx, L.cy] };
        }
      }
      return null;
    },
    halt() { const p = moverPos(state.player); teleport(Math.round(p.x), Math.round(p.y)); },
    /** Drop chaser 0 right onto the hero (it then moves on). */
    ghostTouch() { const g = ghosts.find(q => q.active); const p = state.player.from; g.m = mover(p.x, p.y); g.wait = 0; },
    ghostsHome() { for (const g of ghosts) if (g.active) { g.m = mover(g.home.x, g.home.y); cellWorld(g.home.x, g.home.y, g.cur); g.prev.copy(g.cur); } },
    eatAllTargetsBut(k = 1) { const ts = state.letters.filter(L => L.target && !L.eaten); ts.slice(0, Math.max(0, ts.length - k)).forEach(eat); },
    setLives(n) { state.lives = n; renderStats(); },
    setupLevel,
    letters: () => state.letters.map(L => ({ ch: L.ch, target: L.target, eaten: L.eaten, cell: [L.cx, L.cy] })),
    /** Close-up camera on the hero (visual checks of the voxel models). */
    /** Close-up of the hero and a chaser standing on the lawn beside the maze (pause first). */
    closeup(mouth = 0, yaw = 0.6) {
      const x0 = state.maze.W / 2 + 3, g = ghosts[0];
      state.heroCur.set(x0, 0, 0); state.heroPrev.copy(state.heroCur);
      g.cur.set(x0 + 1.1, 0, 0); g.prev.copy(g.cur); g.group.visible = true; g.group.rotation.y = -0.4;
      jawTop.rotation.x = -mouth; jawBot.rotation.x = mouth * 0.55; hero.rotation.y = yaw; hero.visible = true;
      camera.clearViewOffset(); rig.base.set(x0 + 0.55, 2.0, 4.6); camera.position.copy(rig.base); camera.lookAt(x0 + 0.55, 0.3, 0);
    },
    screen() {
      const W = app.stage.clientWidth, H = app.stage.clientHeight, b = projBounds(camera, mazeCorners(), W, H);
      return { maze: b, free: rig.free, W, H, yaw: rig.yaw };
    },
  };
}
</script>
