    .demo { display: none; }

const MAX_LEVEL = 4;                       // levels by syllable count: 2, 3, 4, 5–6 (the original's four levels)

const secondsFor = (mode, n) => (mode === "normal" ? 10 : 10 + Math.max(0, n - 2) * 4);
const LANDSCAPE = matchMedia("(orientation: landscape) and (max-height: 600px)");

/* ============================== state ============================== */
const state = {

/* ---------- a tiny scheduler on game time: pausing freezes it, a new game cancels it ---------- */
const timers = [];
function after(sec, fn) { const gen = state.gen; timers.push({ t: sec, fn: () => { if (gen === state.gen) fn(); } }); }

  const due = [];
  for (const t of timers) { t.t -= dt; if (t.t <= 0) due.push(t); }
  for (const d of due) timers.splice(timers.indexOf(d), 1);

/* ============================== layout ============================== */
function layout() {

  const gap = W < 360 ? 6 : 8;
  let pad = 8;
  let t = Math.floor((W - 2 * (pad + 1) - gap * (n - 1)) / n);
  if (t < 50) { pad = 0; t = Math.floor((W - gap * (n - 1)) / n); }       // narrow phones: flat tray, bigger tiles
  if (LANDSCAPE.matches) t = Math.min(t, Math.floor((play.clientHeight - 30 - 44 - 3 * 8 - 2 * (pad + 1)) / 2));
  t = Math.max(40, Math.min(innerWidth >= 700 ? 84 : 72, t));
  tileSize = t;
  game.style.setProperty("--tile", t + "px");
  game.style.setProperty("--gap", gap + "px");
  game.style.setProperty("--tray-pad", pad + "px");
  trayEl.classList.toggle("flat", pad === 0);
  const p = Math.floor(Math.max(72, Math.min(picWrap.clientWidth - 16, picWrap.clientHeight - 16, 330)));
  game.style.setProperty("--pic", p + "px");
  game.classList.toggle("kb", FINE.matches);

}
/** Shrink a syllable's font only when it would not fit its tile (e.g. స్త్రం, ర్మ్యం). */
function fitTexts() {

    const tx = t.el.firstChild;
    t.el.style.removeProperty("--fs");
    const w = tx.offsetWidth, h = tx.offsetHeight;

let feedbackTimer = 0;

}

/* ============================== board ============================== */
function scramble(syl) {
  for (let k = 0; k < 30; k++) { const s = rand.shuffle(syl); if (s.join("|") !== syl.join("|")) return s; }
  return [...syl].reverse();
}
function buildBoard() {
  const w = state.word, order = scramble(w.syl);
  slots = w.syl.map((_, i) => el("div", { class: "slot", dataset: { i }, attrs: { role: "listitem" } }));
  homes = order.map((_, i) => el("div", { class: "home", dataset: { i } }, el("span", { class: "kbd", text: String(i + 1) })));
  tiles = order.map((text, i) => {
    const node = el("button", { type: "button", class: "tile", dataset: { t: i }, attrs: { "aria-label": `అక్షరం ${text}` } }, el("span", { class: "tx", text }));
    homes[i].append(node);

}
const tileOf = node => tiles[+node.dataset.t];
const firstEmpty = () => { const i = placed.findIndex(p => !p); return i < 0 ? null : i; };

/** Move a tile into slot s (or back to its tray home when s is null) and fly it there from where it is now. */
function moveTo(t, s, { animate = true } = {}) {

  const hadFocus = document.activeElement === t.el;
  t.el.classList.remove("dragging", "sel", "bad");
  t.el.style.transform = "";
  if (t.slot !== null && placed[t.slot] === t) { placed[t.slot] = null; slots[t.slot].classList.remove("filled"); }   // (a swap may already have refilled it)
  t.slot = s;
  if (s !== null) { placed[s] = t; slots[s].append(t.el); slots[s].classList.add("filled"); }
  else homes[t.home].append(t.el);

  if (hadFocus) t.el.focus({ preventScroll: true });

    const k = last.width ? first.width / last.width : 1;
    if (Math.abs(dx) > 1 || Math.abs(dy) > 1 || Math.abs(k - 1) > 0.02)

function select(t) { deselect(); selected = t; t.el.classList.add("sel"); game.classList.add("picking"); sfx.play("tap"); }

/** Player put tile t into slot s (an occupant goes back to the tray). */
function place(t, s) {

  if (occ === t || occ?.locked) return;

  undo.push(t);

}
function unplace(t) { if (t.locked || t.slot === null) return; moveTo(t, null); sfx.play("tap"); }

/* ---------- taps ---------- */
function tapTile(t, keyboard = false) {
  if (state.phase !== "play" || t.locked) return;

    if (selected && !keyboard) { const s = t.slot; place(selected, s); return; }
    return unplace(t);                                     // original: tap a placed tile to return it
  }

}

  const s = +cell.dataset.i;
  if (selected) return place(selected, s);
  say("ముందు ఒక అక్షరాన్ని ఎంచుకోండి", "info", 1600);

/* ---------- drag & drop (pointer events: one stream for mouse, touch and pen) ---------- */
let drag = null, press = null;

function cancelDrag() {

  drag = null; press = null; clearOver();
}
game.addEventListener("pointerdown", e => {

  const tileEl = e.target.closest(".tile");
  if (tileEl) {
    const t = tileOf(tileEl);
    if (!t || t.locked) return;
    e.preventDefault();
    try { tileEl.setPointerCapture(e.pointerId); } catch { /* ignore */ }
    drag = { t, id: e.pointerId, x0: e.clientX, y0: e.clientY, moved: false };
    return;

});
game.addEventListener("pointermove", e => {

    if (selected === drag.t) deselect();
    flights.get(drag.t.el)?.cancel();

/* ============================== rules ============================== */

}

  if (state.combo >= 2) { comboEl.classList.remove("pop"); void comboEl.offsetWidth; comboEl.classList.add("pop"); }
  const r = slotsEl.getBoundingClientRect();
  confetti(r.left + r.width / 2, r.top + r.height / 2, 30);
  floatText(`+${pts}`, scorePill);
  sfx.play("good"); if (bonus) setTimeout(() => sfx.play("coin"), 180);
  haptic([12, 40, 12]);
  if (state.cfg.speak) setTimeout(() => speak(state.word.te), 250);
  after(1.5, nextWord);
}
function wrongAnswer() {
  state.phase = "shake";                     // the clock is frozen while the slots shake (original kept ticking)
  state.combo = 0; state.wrong++;
  say("మళ్ళీ ప్రయత్నించు", "bad");
  tiles.forEach(t => { if (t.slot !== null && !t.locked) t.el.classList.add("bad"); });
  slotsEl.classList.remove("shake"); void slotsEl.offsetWidth; slotsEl.classList.add("shake");
  sfx.play("bad"); haptic([20, 30, 20]);
  renderHud();
  after(0.75, () => {
    slotsEl.classList.remove("shake");
    for (const t of tiles) if (t.slot !== null && !t.locked) moveTo(t, null);
    undo = [];
    state.phase = "play";
    say("మళ్ళీ ప్రయత్నించు", "bad", 900);
    renderHint();
  });
}
function timeout() {
  state.phase = "timeout"; cancelDrag(); deselect();       // input is locked from this instant: no late taps
  state.combo = 0; state.missRow++;
  record(false);
  const syl = state.word.syl;
  for (const t of tiles) if (!t.locked && t.slot !== null && t.text !== syl[t.slot]) moveTo(t, null);
  syl.forEach((s, i) => { if (!placed[i]) { const t = tiles.find(x => x.slot === null && x.text === s); if (t) moveTo(t, i); } });
  tiles.forEach(t => t.el.classList.add("reveal"));
  say(`సమయం ముగిసింది! — ${state.word.te}`, "warn");
  sfx.play("bad"); haptic([30, 40, 30]);
  renderHud(); renderSecs();
  if (state.cfg.speak) setTimeout(() => speak(state.word.te), 250);
  if (state.missRow === 2) app.toast("జాగ్రత్త! ఇంకొక పదం కోల్పోతే ఆట ముగుస్తుంది", { tone: "bad", ms: 2200 });
  after(2.2, () => (state.missRow >= 3 ? endGame(false) : nextWord()));
}
function hintIndex() { let i = 0; while (i < placed.length && placed[i]?.locked) i++; return i; }
function useHint() {
  if (state.phase !== "play") return;
  const n = state.word.syl.length, i = hintIndex();
  if (i >= n - 1) return;                                  // never reveal the whole word
  cancelDrag(); deselect();
  const want = state.word.syl[i];
  let t = placed[i]?.text === want ? placed[i] : null;
  if (!t) {
    if (placed[i]) moveTo(placed[i], null);
    t = tiles.find(x => !x.locked && x.text === want && x.slot === null) ?? tiles.find(x => !x.locked && x.text === want);
    if (!t) return;
    moveTo(t, i);
  }
  t.locked = true; t.el.classList.add("locked"); t.el.setAttribute("aria-disabled", "true");
  state.hints++;
  sfx.play("coin"); haptic(10);
  say(`సూచన: ${i === 0 ? "మొదటి" : `${i + 1}వ`} అక్షరం ${want} (−${HINT_COST})`, "info", 2200);
  renderHint();
  if (placed.every(Boolean)) check();
}

/* ============================== flow ============================== */
/** app.overlay + a class on the card (short landscape screens lay "split" / "final" cards out in two columns). */
function showCard(opts, cls) {
  app.overlay(opts);
  const card = app.stage.querySelector(".tt-overlay .tt-card");
  card?.classList.add(cls);
  return card;
}
function startGame() {
  state.gen++; timers.length = 0;
  cancelDrag();
  state.cfg = { ...app.settings };
  Object.assign(state, { score: 0, combo: 0, missRow: 0, results: [], levelLog: [], pausedFrom: null });
  game.classList.remove("blur");
  levelIntro(state.cfg.start, null);
}
function levelIntro(n, prev) {
  state.phase = "intro"; state.level = n; state.idx = 0; state.levelScore = 0; state.levelRes = [];
  state.words = rand.shuffle(bank[n]).slice(0, state.cfg.perLevel);
  state.word = null;
  setIdle(true);
  renderHud();
  const best = timed() ? app.best(bestKey(n)).get() : 0;
  showCard({
    title: `స్థాయి ${n}`,
    body: el("div", { class: "intro" },
      prev ? el("p", { class: prev.isNew ? "rec" : "", text: `స్థాయి ${prev.level} పూర్తి: ${prev.score} పాయింట్లు${prev.isNew ? " — కొత్త రికార్డు! 🎉" : ""}` }) : null,
      el("p", { text: `${LEVEL_SYL[n]} అక్షరాల పదాలు · ${state.words.length} పదాలు` }),
      el("p", { class: "ctl", text: timeLine(n) }),
      best ? el("p", { class: "best-line" }, "ఈ స్థాయిలో ఉత్తమం: ", el("b", { text: String(best) })) : null),
    actions: [{ label: "మొదలు", onClick: () => { app.hideOverlay(); loadWord(); } }],
  }, "split");
}
function timeLine(n) {
  if (!timed()) return "అభ్యాసం: సమయ పరిమితి లేదు";
  const secs = [...new Set(bank[n].map(w => secondsFor(state.cfg.timer, w.syl.length)))].sort((a, b) => a - b);
  return `ఒక్కో పదానికి ${secs.length > 1 ? `${secs[0]}–${secs[secs.length - 1]}` : secs[0]} సెకన్లు`;
}
function loadWord() {
  state.word = state.words[state.idx];
  const n = state.word.syl.length;
  state.total = state.time = secondsFor(state.cfg.timer, n);
  state.hints = 0; state.wrong = 0; state.lastSec = null;
  pic.classList.remove("won", "low");
  emojiEl.textContent = state.word.emoji;
  emojiEl.classList.remove("in"); void emojiEl.offsetWidth; emojiEl.classList.add("in");
  buildBoard();
  setIdle(false); game.classList.remove("blur");
  state.phase = "play";
  say("");
  renderHud(); renderSecs(); renderRing();
  if (state.idx === 0 && state.level === state.cfg.start) say(isTouch() ? "అక్షరాన్ని లాగి గడిలో వదలండి" : "అక్షరాన్ని లాగండి లేదా 1–" + n + " నొక్కండి", "info", 2400);
}
function nextWord() {
  state.idx++;
  if (state.idx < state.words.length) return loadWord();
  // level complete
  const lvl = state.level;
  const res = timed() ? app.best(bestKey(lvl)).submit(state.levelScore) : null;
  const entry = { level: lvl, score: state.levelScore, best: res?.best ?? null, isNew: !!res?.isNew, done: true };
  state.levelLog.push(entry);
  if (lvl >= MAX_LEVEL) return endGame(true);
  sfx.play("level");
  levelIntro(lvl + 1, entry);
}
function endGame(win) {
  state.phase = "over"; cancelDrag(); deselect();
  if (!win && !state.levelLog.some(l => l.level === state.level))
    state.levelLog.push({ level: state.level, score: state.levelScore, best: null, isNew: false, done: false });
  const tot = timed() ? app.best(totalKey()).submit(state.score) : null;
  const solvedN = state.results.filter(r => r.ok).length;
  const missed = state.results.filter(r => !r.ok), hinted = state.results.filter(r => r.ok && r.hints > 0);
  setIdle(true);
  sfx.play(win ? "win" : "bad");
  if (win) { confetti(innerWidth / 2, innerHeight * 0.45, 80, 1.6); setTimeout(() => confetti(innerWidth * 0.3, innerHeight * 0.4, 40), 350); }
  const voice = canSpeakTelugu();
  const row = r => el("div", { class: "rv" },
    el("span", { class: "rv__e", text: r.w.emoji, attrs: { role: "img", "aria-label": "చిత్రం" } }),
    el("div", { class: "rv__w" }, el("b", { text: r.w.te }), el("span", { class: "rv__s" }, r.w.syl.map(s => el("i", { text: s })))),
    voice ? el("button", { type: "button", class: "tt-iconbtn", attrs: { "aria-label": `${r.w.te} — వినండి` }, on: { click: () => speak(r.w.te) } }, icon("sound")) : null);
  const reviewCol = el("div", { class: "rv-col" },
    missed.length ? [el("h3", { text: `నేర్చుకోవలసిన పదాలు (${missed.length})` }), el("div", { class: "rv-list" }, missed.map(row))]
      : el("p", { class: "allgood", text: "ఒక్క పదం కూడా తప్పిపోలేదు! 👏" }),
    hinted.length ? [el("h3", { text: `సూచనతో చేసినవి (${hinted.length})` }), el("div", { class: "rv-list" }, hinted.map(row))] : null);
  const stats = [{ label: "మీ తుది స్కోరు", value: state.score }, ...(tot ? [{ label: "ఉత్తమం", value: tot.best }] : []), { label: "పదాలు", value: `${solvedN}/${state.results.length}` }];
  const card = showCard({
    title: win ? "అభినందనలు!" : "ఆట ముగిసింది!",
    body: el("div", { class: "summary" },
      el("div", { class: "sum-l" },
        el("p", { text: win ? "మీరు అన్ని స్థాయిలను పూర్తి చేసారు!" : "మీరు వరుసగా 3 పదాలను కోల్పోయారు." }),
        el("div", { class: "tt-card__stat" }, stats.map(st => el("div", {}, el("b", { text: String(st.value) }), el("span", { text: st.label })))),
        tot?.isNew ? el("p", { class: "rec", text: "కొత్త రికార్డు! 🎉" }) : null,
        !timed() ? el("p", { class: "note", text: "అభ్యాస ఆట — ఉత్తమ స్కోర్లు నమోదు కావు." }) : null,
        state.levelLog.length ? el("div", { class: "levels" }, state.levelLog.map(l => el("span", { class: "lvchip" + (l.isNew ? " new" : "") },
          `స్థాయి ${l.level}: ${l.score}`, el("small", { text: l.done ? (l.best != null ? ` · ఉత్తమం ${l.best}${l.isNew ? " ★" : ""}` : "") : " · అసంపూర్తి" })))) : null),
      el("div", { class: "sum-r" }, reviewCol)),
    actions: [{ label: "మళ్ళీ ఆడు", onClick: startGame }, { label: "అమరికలు", ghost: true, onClick: app.openSettings }],
  }, "final");
  card?.querySelector(".sum-r")?.append(card.querySelector(".tt-card__actions"));   // buttons sit under the word list
}
function togglePause() {
  if (state.phase === "paused") return resume();
  if (!["play", "checking", "shake", "solved", "timeout"].includes(state.phase)) return;
  if (drag?.moved) { const t = drag.t; cancelDrag(); moveTo(t, t.slot, { animate: false }); } else cancelDrag();
  deselect();
  state.pausedFrom = state.phase; state.phase = "paused";
  game.classList.add("blur");                               // no peeking at the tiles while the clock is stopped
  app.overlay({ title: "ఆట ఆగింది", actions: [
    { label: "కొనసాగించు", onClick: resume },
    { label: "మళ్ళీ మొదలు", ghost: true, onClick: startGame },
    { label: "అమరికలు", ghost: true, onClick: app.openSettings },
  ] });
}
function resume() {
  if (state.phase !== "paused") return;
  state.phase = state.pausedFrom; game.classList.remove("blur"); app.hideOverlay(); renderHint();
}
function showMenu() {
  state.phase = "menu"; setIdle(true);
  const s = app.settings;
  const timerLabel = SETTINGS[0].options.find(o => o.value === s.timer)?.label;
  const best = s.timer !== "practice" ? app.best(`${s.timer}-${s.perLevel}:from${s.start}`).get() : 0;
  showCard({
    title: "తడపేరాట",
    body: el("div", { class: "intro" },
      el("div", { class: "demo", attrs: { "aria-hidden": "true" } }, el("span", { class: "e", text: "🐘" }), el("span", { class: "arr", text: "→" }),
        ["ఏ", "ను", "గు"].map(x => el("span", { class: "t", text: x }))),
      el("p", { text: "బొమ్మను చూసి, అక్షరాలను సరైన క్రమంలో పేర్చి పదాన్ని కట్టండి!" }),
      el("p", { class: "ctl", text: isTouch() ? "అక్షరాన్ని లాగి గడిలో వదలండి — లేదా తాకి, ఆపై గడిని తాకండి" : "అక్షరాన్ని లాగి వదలండి · లేదా 1–6, Backspace" }),
      best ? el("p", { class: "best-line" }, "ఉత్తమ స్కోరు: ", el("b", { text: String(best) })) : null,
      el("small", { text: `${timerLabel} · స్థాయి ${s.start} నుండి · ఒక్కో స్థాయిలో ${s.perLevel} పదాలు` })),
    actions: [{ label: "ఆట మొదలుపెట్టు", onClick: startGame }, { label: "అమరికలు", ghost: true, onClick: app.openSettings }],
  }, "split");
}

/* ============================== effects ============================== */
const CONF = ["#ffc233", "#ff8a3d", "#34d17e", "#22c3d6", "#ff5c93", "#8f80ff", "#ffffff"];
function confetti(x, y, count = 30, power = 1) {
  if (prefersReducedMotion()) return;
  for (let i = 0; i < count; i++) {
    const p = el("i", { class: "cf" + (i % 3 === 0 ? " round" : ""), style: { left: x + "px", top: y + "px", background: CONF[i % CONF.length] } });
    fx.append(p);
    const a = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.3;
    const v = (130 + Math.random() * 230) * power;
    const dx = Math.cos(a) * v, dy = Math.sin(a) * v, rot = (Math.random() - 0.5) * 1000;
    const anim = p.animate([
      { transform: "translate(0, 0) rotate(0deg)", opacity: 1 },
      { transform: `translate(${dx * 0.75}px, ${dy * 0.75}px) rotate(${rot * 0.5}deg)`, opacity: 1, offset: 0.35 },
      { transform: `translate(${dx}px, ${dy + 340}px) rotate(${rot}deg)`, opacity: 0 },
    ], { duration: 1100 + Math.random() * 600, easing: "cubic-bezier(.2,.65,.4,1)" });
    anim.onfinish = () => p.remove();
  }
}
function floatText(text, anchor) {
  const r = anchor.getBoundingClientRect();
  const f = el("div", { class: "float", text, style: { left: r.left + r.width / 2 + "px", top: r.bottom + 14 + "px" } });
  fx.append(f);
  if (prefersReducedMotion()) { setTimeout(() => f.remove(), 900); return; }
  f.animate([{ transform: "translate(-50%, -50%) translateY(10px)", opacity: 0 }, { transform: "translate(-50%, -50%)", opacity: 1, offset: 0.2 }, { transform: "translate(-50%, -50%) translateY(-26px)", opacity: 0 }],
    { duration: 1100, easing: "ease-out" }).onfinish = () => f.remove();
}

/* ============================== loop ============================== */
function update(dt) {
  if (state.phase === "paused") return;
  if (document.querySelector("dialog[open]")) return;      // help / settings open: the clock and transitions wait
  runTimers(dt);
  if (state.phase === "play" && timed()) {
    state.time = Math.max(0, state.time - dt);
    const s = Math.ceil(state.time);
    if (s !== state.lastSec) { state.lastSec = s; renderSecs(); if (s > 0 && s <= 3) sfx.play("tick"); }
    if (state.time <= 0) timeout();
  }
}
const loop = createLoop({ update, render: renderRing, onHidden: () => { if (state.phase !== "paused") togglePause(); } });
document.addEventListener("visibilitychange", () => { if (!document.hidden) loop.start(); });

/* ============================== keyboard ============================== */
const keys = { Backspace: undoLast, Delete: undoLast, KeyH: useHint, h: useHint, KeyP: togglePause, Escape: togglePause,
  Enter: () => {
    if (state.phase === "play") { if (selected) autoPlace(selected, true); return; }
    if (app.overlayOpen) app.stage.querySelector(".tt-overlay .tt-card__actions button")?.click();   // start / continue even before the card's button has focus
  } };
for (let k = 1; k <= 9; k++) {
  const pick = () => {
    if (state.phase !== "play") return;
    const t = tiles.find(x => x.home === k - 1);
    if (!t || t.locked) return;
    if (t.slot !== null) unplace(t); else autoPlace(t, false);
  };
  keys[String(k)] = pick; keys[te.DIGITS[k]] = pick;
}
keyControls(keys);

/* ============================== boot ============================== */
showMenu();
loop.start();
layout();
if (DEBUG) window.__game = {
  state, bank, startGame, useHint, togglePause,
  get answer() { return state.word?.syl ?? null; },
  get tiles() { return tiles.map(t => ({ text: t.text, home: t.home, slot: t.slot, locked: t.locked })); },
  setTime(s) { state.time = s; },
};
</script>
