/** Verbatim rules of the original categorizeAksharam(). */
function categorizeAksharam(aksharam) {
  const categories = new Set();
  const independentLongVowels = new Set(["ఆ", "ఈ", "ఊ", "ౠ", "ఏ", "ఓ"]);
  if (independentVowels.has(aksharam[0])) categories.add("అచ్చు");
  else if (diacritics.has(aksharam)) categories.add("అచ్చు");
  if ([...aksharam].some(c => teluguConsonants.has(c))) categories.add("హల్లు");
  if ([...aksharam].some(c => longVowels.has(c)) || independentLongVowels.has(aksharam)) categories.add("దీర్ఘ");
  if (aksharam.includes("ః")) categories.add("విసర్గ అక్షరం");
  if (aksharam.includes("ం")) categories.add("అనుస్వారం");
  let foundConjunct = false, foundDouble = false;
  for (let i = 0; i < aksharam.length - 2; i++) {
    if (teluguConsonants.has(aksharam[i]) && aksharam[i + 1] === halant && teluguConsonants.has(aksharam[i + 2])) {
      if (aksharam[i] === aksharam[i + 2]) foundDouble = true; else foundConjunct = true;
    }
  }
  if (foundConjunct) categories.add("సంయుక్తాక్షరం");
  if (foundDouble) categories.add("ద్విత్వాక్షరం");
  if ((categories.has("హల్లు") || categories.has("అచ్చు")) && !categories.has("దీర్ఘ") && !categories.has("అనుస్వారం") && !categories.has("విసర్గ అక్షరం")) {
    categories.add("హ్రస్వాక్షరం");
  }
  for (const ch of aksharam) addLetterCategories(ch, categories);
  let foundDependentVowel = false;
  for (const dvSign in dependentToIndependent) {
    if (aksharam.includes(dvSign)) { foundDependentVowel = true; addLetterCategories(dependentToIndependent[dvSign], categories); }
  }
  if ([...aksharam].some(c => teluguConsonants.has(c)) && !foundDependentVowel && !aksharam.endsWith(halant)) addLetterCategories("అ", categories);
  return Array.from(categories).sort();
}

function ganaIndex(famKeys) {
  const map = new Map(); let maxLen = 0;
  for (const f of FAMILIES) {
    if (!famKeys.includes(f.key)) continue;
    for (const [pattern, name] of Object.entries(GANA_DEFINITIONS[f.def])) {
      if (!map.has(pattern)) map.set(pattern, []);
      map.get(pattern).push({ family: f.def, name });
      maxLen = Math.max(maxLen, pattern.length);
    }
  }
  return { map, maxLen, families: famKeys };
}
/** f[i] = number of ways (BigInt) to split seq[i..] into patterns of the index. f[0] is the total. */
function countTable(seq, gi) {
  const n = seq.length, f = new Array(n + 1).fill(0n);
  f[n] = 1n;
  for (let i = n - 1; i >= 0; i--) {
    let sum = 0n;
    for (let L = 1; L <= gi.maxLen && i + L <= n; L++) if (gi.map.has(seq.slice(i, i + L))) sum += f[i + L];
    f[i] = sum;
  }
  return f;
}
/** The first `cap` partitions, longest gana first; dead ends are pruned with the count table (O(cap·n)). */
function listPartitions(seq, gi, cap, f = countTable(seq, gi)) {
  const n = seq.length, out = [];
  if (!n || f[0] === 0n || cap < 1) return out;
  const stack = [{ i: 0, next: Math.min(gi.maxLen, n), L: 0 }];
  while (stack.length && out.length < cap) {
    const top = stack[stack.length - 1];
    if (top.i === n) {
      out.push(stack.slice(0, -1).map(e => { const pattern = seq.slice(e.i, e.i + e.L); return { start: e.i, len: e.L, pattern, labels: gi.map.get(pattern) }; }));
      stack.pop(); continue;
    }
    let pushed = false;
    while (top.next >= 1) {
      const L = top.next--, j = top.i + L;
      if (f[j] > 0n && gi.map.has(seq.slice(top.i, j))) { top.L = L; stack.push({ i: j, next: Math.min(gi.maxLen, n - j), L: 0 }); pushed = true; break; }
    }
    if (!pushed) stack.pop();
  }
  return out;
}

/* ---------- comparison metrics (verbatim from the original) ---------- */
function calculateGanaJaccard(markers1, markers2) {
  const getBigrams = markers => {
    const bigrams = new Set(), pure = markers.filter(m => m);
    if (pure.length < 2) return bigrams;
    for (let i = 0; i < pure.length - 1; i++) bigrams.add(pure[i] + pure[i + 1]);
    return bigrams;
  };
  const b1 = getBigrams(markers1), b2 = getBigrams(markers2);
  const inter = new Set([...b1].filter(x => b2.has(x))), union = new Set([...b1, ...b2]);
  const similarity = union.size > 0 ? inter.size / union.size : 1;
  return { similarity, distance: 1.0 - similarity };
}
function findLongestCommonSubstring(seq1, seq2) {
  const m = seq1.length, n = seq2.length;
  let prev = new Array(n + 1).fill(0), maxLength = 0, endIndex = 0, endIndex2 = 0;
  for (let i = 1; i <= m; i++) {
    const row = new Array(n + 1).fill(0);
    for (let j = 1; j <= n; j++) {
      if (seq1[i - 1] === seq2[j - 1]) {
        row[j] = prev[j - 1] + 1;
        if (row[j] > maxLength) { maxLength = row[j]; endIndex = i; endIndex2 = j; }
      }
    }
    prev = row;
  }
  return { seq: maxLength ? seq1.slice(endIndex - maxLength, endIndex) : [], startA: endIndex - maxLength, startB: endIndex2 - maxLength, length: maxLength };
}

/* =====================================================================================
   ANALYSIS
   FIX: te.tokenize() separates aksharas from spaces, CR, tabs, digits and punctuation, so
   only real aksharas are tagged and scanned (the old splitter made "\r", tabs and Telugu
   digits into laghu "syllables"). Segmentation otherwise follows the original: ZWJ/ZWNJ
   are dropped, ఁ is ignored, and a lone pollu (C్) joins the akshara before it in the word.
   ===================================================================================== */
function analyze(raw) {
  const t0 = performance.now();
  const text = String(raw ?? "").replace(/\r\n?/g, "\n");
  const sanitized = text.replace(/[^ఀ-౿\s​\n]+/g, "");
  const items = [], list = [];
  let line = 0, prevAk = false;
  for (const tok of te.tokenize(text.replace(/[‌‍]/g, ""), { mergeFinalPollu: false })) {
    if (tok.type === "akshara") {
      const key = tok.text.split(ARASUNNA).join("");
      if (!key) { prevAk = false; continue; }
      const last = items[items.length - 1];
      if (prevAk && last && key.length === 2 && teluguConsonants.has(key[0]) && key[1] === halant) {
        last.key += key; last.display += tok.text; list[list.length - 1] = last.key; continue;
      }
      items.push({ key, display: tok.text, line }); list.push(key); prevAk = true;
    } else {
      prevAk = false;
      if (tok.type === "space") for (const ch of tok.text) { if (ch === "\n") { line++; list.push("\n"); } else list.push(" "); }
    }
  }
  // guru / laghu — the original aksharaGanaVibhajana() rules, with the reason kept for display
  const sets = items.map(it => { it.tags = tagsOf(it.key); return new Set(it.tags); });
  items.forEach((it, i) => {
    const T = sets[i], k = it.key, r = [];
    if (T.has("దీర్ఘ")) r.push("dirgha");
    if (k.includes("ఐ") || k.includes("ఔ") || k.includes("ై") || k.includes("ౌ")) r.push("aiau");
    if (T.has("అనుస్వారం")) r.push("anusvara");
    if (T.has("విసర్గ అక్షరం")) r.push("visarga");
    if (k.endsWith(halant)) r.push("pollu");
    const nx = sets[i + 1];                          // next syllable anywhere in the text, as in the original
    if (nx && (nx.has("సంయుక్తాక్షరం") || nx.has("ద్విత్వాక్షరం"))) r.push("next");
    it.reasons = r; it.mark = r.length ? "U" : "I"; it.pos = i;
  });
  const unique = new Map();
  items.forEach((it, pos) => {
    let u = unique.get(it.key);
    if (!u) unique.set(it.key, u = { aksharam: it.key, tags: it.tags, count: 0, positions: [], U: 0, I: 0 });
    u.count++; u.positions.push(pos); u[it.mark]++;
  });
  const categoryCounts = {}, tags = new Set();
  for (const u of unique.values()) for (const c of u.tags) { categoryCounts[c] = (categoryCounts[c] || 0) + u.count; tags.add(c); }
  const lines = text.split("\n").map((t, index) => ({ index, text: t, items: [] }));
  items.forEach((it, i) => lines[it.line].items.push(i));
  const sanSet = new Set(sanitized);
  return {
    raw: String(raw ?? ""), text, sanitized, items, aksharaluList: list, unique, categoryCounts, tags,
    padas: lines.filter(l => l.items.length),
    sequence: items.map(it => it.mark).join(""),
    guru: items.filter(it => it.mark === "U").length,
    hash: simpleHash(sanitized),
    characterCount: sanitized.length,
    wordCount: sanitized.split(/\s+/).filter(w => w.trim()).length,
    // FIX: counted on the text before punctuation is stripped (the old count was always 1)
    sentenceCount: text.split(/[।॥.?!]+/).filter(s => /\p{L}/u.test(s)).length,
    paragraphCount: sanitized.split("\n").filter(p => p.trim()).length,
    removedChars: [...new Set([...text].filter(ch => !sanSet.has(ch) && ch !== "\r"))].sort(),
    ms: performance.now() - t0,
  };
}

function compareTexts(a, b) {
  const A = analyze(a), B = analyze(b);
  const common = [...A.tags].filter(t => B.tags.has(t)).sort();
  const union = new Set([...A.tags, ...B.tags]);
  const onlyA = [...A.tags].filter(t => !B.tags.has(t)).sort(), onlyB = [...B.tags].filter(t => !A.tags.has(t)).sort();
  const jaccardSimilarity = union.size > 0 ? common.length / union.size : 0;
  const mA = [...A.sequence], mB = [...B.sequence];
  return { A, B, common, onlyA, onlyB, jaccardSimilarity, jaccardDistance: 1 - jaccardSimilarity, ganaJaccard: calculateGanaJaccard(mA, mB), lcs: findLongestCommonSubstring(mA, mB) };
}

}

/* ---------- responsive SVG bar charts (redrawn at the host's width) ---------- */
const charts = new Set();
const chartRO = new ResizeObserver(entries => { for (const e of entries) e.target._draw?.(); });
function barChart(rows, { series = [{ cls: "sA", label: "" }], label = "", labels = null } = {}) {
  const host = el("div", { class: "chart" });
  host._draw = () => {
    const W = Math.floor(host.clientWidth);
    if (W < 60 || host._w === W) return;
    host._w = W;
    const font = W < 420 ? 12.5 : 13.5;
    const labelW = Math.min(Math.round(W * 0.45), Math.ceil(Math.max(40, ...(labels ?? rows.map(r => r.label)).map(t => measure(t, font)))) + 12);
    const valW = 34, plotX = labelW, plotW = Math.max(30, W - labelW - valW);
    const nS = series.length, barH = nS > 1 ? 11 : 14, inner = nS * barH + (nS - 1) * 2;
    const rowH = Math.max(inner + 10, 26), H = rows.length * rowH + 2;
    const max = Math.max(1, ...rows.flatMap(r => r.values));
    const root = svg("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": label });
    root.append(svg("line", { x1: plotX + 0.5, x2: plotX + 0.5, y1: 0, y2: H, class: "c-axis" }));
    rows.forEach((r, ri) => {
      const y0 = ri * rowH + 1, cy = y0 + rowH / 2;
      const g = svg("g", { class: "c-row" }, svg("rect", { x: 0, y: y0, width: W, height: rowH, class: "c-hit" }), svg("title", {}, r.title ?? `${r.label}: ${r.values.join(" / ")}`));
      g.append(svg("text", { x: labelW - 8, y: cy, "text-anchor": "end", "dominant-baseline": "central", class: "c-lab", "font-size": font }, r.label));
      let by = cy - inner / 2;
      r.values.forEach((v, si) => {
        const w = (v / max) * (plotW - 4);
        if (v > 0) {
          const ww = Math.max(w, 3), rr = Math.min(4, ww, barH / 2);
          g.append(svg("path", { class: `c-bar ${series[si].cls}`, d: `M${plotX + 1},${by}h${ww - rr}a${rr},${rr} 0 0 1 ${rr},${rr}v${barH - 2 * rr}a${rr},${rr} 0 0 1 ${-rr},${rr}h${-(ww - rr)}z` }));
        }
        g.append(svg("text", { x: plotX + 1 + Math.max(w, v > 0 ? 3 : 0) + 5, y: by + barH / 2, "dominant-baseline": "central", class: "c-val", "font-size": font - 1 }, fmtN(v)));
        by += barH + 2;
      });
      root.append(g);
    });
    setChildren(host, root);
  };
  charts.add(host); chartRO.observe(host);
  return host;
}

function lineCard(an, pada, no, gi, cap) {

    el("span", { class: "ak", text: it.display }), el("span", { class: "mk", text: it.mark }));
  const chips = first

    el("p", { class: "line__src", text: pada.text.trim() }),

const clip = (s, n = 18) => { const a = [...s.trim().replace(/\s+/g, " ")]; return a.length > n ? a.slice(0, n).join("") + "…" : a.join(""); };
function seqCells(seq, from, len) {
  return el("div", { class: "cells", attrs: { "aria-label": seq.join(" ") } }, seq.map((m, i) => el("span", { class: m + (i >= from && i < from + len ? " lcs" : ""), text: m })));
}
function renderCompare(r, host) {
  const vis = visibleCats();
  const tile = (v, label) => el("div", { class: "tile" }, el("b", { text: v.toFixed(3) }), el("span", { text: label }));
  const parts = [["sA", "ఉమ్మడి", r.common], ["sB", "A లో మాత్రమే", r.onlyA], ["sC", "B లో మాత్రమే", r.onlyB]];
  const totalTags = parts.reduce((s, p) => s + p[2].length, 0) || 1;
  const segbar = el("div", { class: "segbar", attrs: { role: "img", "aria-label": parts.map(p => `${p[1]} ${p[2].length}`).join(", ") } },
    parts.filter(p => p[2].length).map(([cls, label, list]) => {
      const pct = list.length / totalTags * 100;
      return el("div", { class: `seg-${cls}`, style: { flex: `${list.length} 1 0` }, title: `${label}: ${list.length}`, text: pct >= 12 ? String(list.length) : "" });
    }));
  const tagList = list => { const shown = list.filter(t => vis.has(t)); return el("div", { class: "tags" }, shown.length ? shown.map(t => el("span", { class: "tag", text: t })) : el("span", { class: "hint", text: "లేవు" })); };
  const hiddenNote = vis.size < 29 ? el("p", { class: "note", text: "దాచిన వర్గాలు జాబితాల్లో కనిపించవు, కానీ సారూప్యత లెక్కలో ఉంటాయి." }) : null;
  const rows = visibleGroups().map(g => [g, g.cats.map(c => ({ label: c, values: [r.A.categoryCounts[c] || 0, r.B.categoryCounts[c] || 0],
    title: `${c}: A ${r.A.categoryCounts[c] || 0}, B ${r.B.categoryCounts[c] || 0}` })).filter(x => x.values[0] || x.values[1])]).filter(([, rs]) => rs.length);
  const mA = [...r.A.sequence], mB = [...r.B.sequence];
  const side = (an, tag) => section(`${tag}: “${clip(an.raw, 22)}”`, `${an.items.length} అక్షరాలు`, [
    el("p", { class: "note", text: `గుర్తింపు ${an.hash} · గురువులు ${an.guru} · లఘువులు ${an.items.length - an.guru} · పాదాలు ${an.padas.length}` }),
    an.items.length ? linesView(an, { limit: 20 }) : el("p", { text: "తెలుగు అక్షరాలు లేవు." })]);
  setChildren(host,
    el("div", { class: "tiles" },
      tile(r.jaccardSimilarity, "అక్షర వర్గాల సారూప్యత (Jaccard)"), tile(r.jaccardDistance, "అక్షర వర్గాల దూరం"),
      tile(r.ganaJaccard.similarity, "గురు లఘు జంటల సారూప్యత"), tile(r.ganaJaccard.distance, "గురు లఘు జంటల దూరం")),
    section("గురు లఘు క్రమాలు", r.lcs.length ? `ఉమ్మడి ${r.lcs.length}` : null, [
      el("div", { class: "seqs" },
        el("div", {}, el("div", { class: "who", text: `A · “${clip(r.A.raw)}” (${mA.length})` }), seqCells(mA, r.lcs.startA, r.lcs.length)),
        el("div", {}, el("div", { class: "who", text: `B · “${clip(r.B.raw)}” (${mB.length})` }), seqCells(mB, r.lcs.startB, r.lcs.length))),
      el("div", { class: "lcsbox" }, el("div", { class: "hint", text: "అతి పొడవైన ఉమ్మడి గురు లఘు భాగం (రెండింటిలో కింద గీతతో):" }),
        el("div", { class: "mono", text: r.lcs.seq.length ? r.lcs.seq.join(" ") : "లేదు" })),
    ], { open: true, id: "cmp-seq" }),
    section("లక్షణాల పోలిక", `${r.common.length} ఉమ్మడి`, [
      segbar,
      el("div", { class: "legend" }, parts.map(([cls, label, list]) => el("span", {}, el("i", { class: `sw ${cls}` }), `${label} ${list.length}`))),
      hiddenNote,
      el("div", { class: "cols2" },
        el("div", {}, el("h3", { class: "sub", text: `ఉమ్మడి వర్గాలు (${r.common.length})` }), tagList(r.common)),
        el("div", {}, el("h3", { class: "sub", text: `A లో మాత్రమే (${r.onlyA.length})` }), tagList(r.onlyA),
          el("h3", { class: "sub", text: `B లో మాత్రమే (${r.onlyB.length})` }), tagList(r.onlyB))),
    ], { open: true, id: "cmp-tags" }),
    rows.length ? section("వర్గాల వారీగా A, B", null, [
      el("div", { class: "legend" }, el("span", {}, el("i", { class: "sw sA" }), "A"), el("span", {}, el("i", { class: "sw sB" }), "B")),
      rows.map(([g, rs]) => [el("h3", { text: g.te }), barChart(rs, { series: [{ cls: "sA", label: "A" }, { cls: "sB", label: "B" }], label: g.te, labels: rows.flatMap(([, x]) => x.map(y => y.label)) })]),
    ], { open: isWide(), id: "cmp-bars" }) : null,
    side(r.A, "A"), side(r.B, "B"));

const tabs = el("div", { class: "tabs", attrs: { role: "tablist", "aria-label": "విభాగాలు" } }, tabBtn("single", "విశ్లేషణ"), tabBtn("compare", "పోలిక"));
tabs.addEventListener("keydown", e => {
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  const next = tabBtns.single.getAttribute("aria-selected") === "true" ? "compare" : "single";
  showTab(next); tabBtns[next].focus(); e.preventDefault();
});

/* single */
const input = el("textarea", { class: "txt", id: "single-input", placeholder: "మీ తెలుగు పద్యం లేదా వాక్యాలు ఇక్కడ ఉంచండి…",
  attrs: { rows: "5", autocomplete: "off", autocapitalize: "off", spellcheck: "false" } });
const results = el("div", { class: "results", hidden: true });
const empty = el("div", { class: "card empty" },
  el("h2", { text: "పద్యం ఇవ్వండి, గురు లఘువులు చూడండి" }),
  el("p", { text: "ప్రతి అక్షరానికి గురువు (U) / లఘువు (I), గణ విభజన, వర్గాలు, ఉచ్చారణ స్థానాలు — ఒక్కో పాదానికి విడిగా." }),
  el("div", { class: "row" }, btn("నమూనా పద్యం చూడండి", () => { input.value = SAMPLE; runSingle(); }, { ghost: false })),
  el("div", { class: "legend-ui" }, el("span", { class: "chip U", style: { cursor: "default" } }, el("span", { class: "ak", text: "రా" }), el("span", { class: "mk", text: "U" })), "గురువు",
    el("span", { class: "chip I", style: { cursor: "default" } }, el("span", { class: "ak", text: "ము" }), el("span", { class: "mk", text: "I" })), "లఘువు"));
const actionsSingle = () => el("div", { class: "actions" },
  btn("పంచుకో", () => shareLink({ text: state.single.raw }, "ఈ తెలుగు పాఠ్యపు గురు లఘువులు, గణాలు చూడండి")),
  Object.assign(btn("కాపీ", () => copyResults(), { title: "ఫలితాలు కాపీ చేయి" }), { ariaLabel: "ఫలితాలు కాపీ" }),
  btn("JSON", () => downloadJSON()));
panels.single = el("section", { class: "panel", id: "panel-single", attrs: { role: "tabpanel", "aria-labelledby": "tab-single" } },
  el("div", { class: "card input" },
    el("label", { class: "lbl", for: "single-input" }, "తెలుగు పాఠ్యం ", el("small", { text: "— ఒక్కో వరుస ఒక పాదం" })),
    input,
    el("div", { class: "row" },
      btn("విశ్లేషించు", () => runSingle(), { ghost: false }),
      btn("నమూనా పద్యం", () => { input.value = SAMPLE; runSingle(); }),
      btn("తుడిచివేయి", () => { input.value = ""; state.single = null; results.hidden = true; setChildren(results); empty.hidden = false; setUrl(null); input.focus(); }))),
  empty, results);

/* compare */
const inA = el("textarea", { class: "txt", id: "cmp-a", placeholder: "మొదటి పాఠ్యం…", attrs: { rows: "4", spellcheck: "false" } });
const inB = el("textarea", { class: "txt", id: "cmp-b", placeholder: "రెండవ పాఠ్యం…", attrs: { rows: "4", spellcheck: "false" } });
const cmpResults = el("div", { class: "results", hidden: true });
panels.compare = el("section", { class: "panel", id: "panel-compare", hidden: true, attrs: { role: "tabpanel", "aria-labelledby": "tab-compare" } },
  el("div", { class: "card input" },
    el("div", { class: "pair" },
      el("div", {}, el("label", { class: "lbl", for: "cmp-a", text: "మొదటి పాఠ్యం (A)" }), inA),
      el("div", {}, el("label", { class: "lbl", for: "cmp-b", text: "రెండవ పాఠ్యం (B)" }), inB)),
    el("div", { class: "row" },
      btn("పోల్చు", () => runCompare(), { ghost: false }),
      btn("నమూనాలు", () => { inA.value = SAMPLE; inB.value = SAMPLE_B; runCompare(); }),
      btn("పంచుకో", () => { if (!state.compare) return app.toast("ముందుగా పోల్చండి", { tone: "bad" }); shareLink({ a: state.compare.A.raw, b: state.compare.B.raw }, "ఈ రెండు తెలుగు పాఠ్యాల పోలిక చూడండి"); }))),
  cmpResults);

app.stage.append(el("div", { class: "page" }, tabs, panels.single, panels.compare, el("footer", { class: "foot", text: `అక్షరానుసారిక v${VERSION}` })));
showTab("single");

/* actions */
function setUrl(q) {
  const p = new URLSearchParams(q ?? {});
  if (DEBUG) p.set("debug", "1");
  const s = p.toString();
  if (s.length < 7000) history.replaceState(null, "", s ? `${location.pathname}?${s}` : location.pathname);
}
const linkFor = q => `${location.origin}${location.pathname}?${new URLSearchParams(q)}`;
function shareLink(q, text) { share({ title: "అక్షరానుసారిక", text, url: linkFor(q) }, app.toast); }

function runSingle({ scroll = true } = {}) {
  const text = input.value;
  if (!text.trim()) { app.toast("దయచేసి కొంత తెలుగు పాఠ్యం ఇవ్వండి", { tone: "bad" }); input.focus(); return; }
  state.single = analyze(text);
  state.json = renderSingle(state.single, results, { actions: actionsSingle() });
  results.hidden = false; empty.hidden = true; disposeBackdrop();
  setUrl({ text });
  if (scroll) requestAnimationFrame(() => results.scrollIntoView({ behavior: smooth(), block: "start" }));
}
function runCompare({ scroll = true } = {}) {
  if (!inA.value.trim() || !inB.value.trim()) { app.toast("పోలికకు రెండు పెట్టెల్లోనూ పాఠ్యం ఇవ్వండి", { tone: "bad" }); return; }
  state.compare = compareTexts(inA.value, inB.value);
  renderCompare(state.compare, cmpResults);
  cmpResults.hidden = false;
  setUrl({ a: inA.value, b: inB.value });
  if (scroll) requestAnimationFrame(() => cmpResults.scrollIntoView({ behavior: smooth(), block: "start" }));
}
function rerender() {
  if (state.single) state.json = renderSingle(state.single, results, { actions: actionsSingle() });
  if (state.compare) renderCompare(state.compare, cmpResults);
}
function downloadJSON() {
  if (!state.single) return;
  const json = buildJSON(state.single);
  const url = URL.createObjectURL(new Blob([JSON.stringify(json, null, 2)], { type: "application/json" }));
  const a = el("a", { href: url, download: `telugu_analysis_${new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19)}.json` });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  app.toast("JSON దిగుమతి అవుతోంది");
}
function resultsText(an) {
  const gi = ganaIndex(enabledFamilies());
  const out = [`అక్షరానుసారిక v${VERSION}`, `అక్షరాలు ${an.items.length} · గురువులు (U) ${an.guru} · లఘువులు (I) ${an.items.length - an.guru} · పాదాలు ${an.padas.length} · వాక్యాలు ${an.sentenceCount}`];
  an.padas.forEach((p, i) => {
    const its = p.items.map(k => an.items[k]), seq = its.map(it => it.mark).join(""), f = countTable(seq, gi);
    const first = f[0] > 0n ? listPartitions(seq, gi, 1, f)[0] : null;
    out.push("", `పాదం ${i + 1}: ${p.text.trim()}`, its.map(it => `${it.display}(${it.mark})`).join(" "));
    if (first) out.push(`${first.map(s => s.pattern).join(" ")}  =  ${first.map(s => shortName(s.labels)).join(" ")}  (${fmtBig(f[0])} విభజనల్లో మొదటిది)`);
    else out.push(seq);
  });
  out.push("", linkFor({ text: an.raw }));
  return out.join("\n");
}
async function copyResults() {
  if (!state.single) return;
  const text = resultsText(state.single);
  try { await navigator.clipboard.writeText(text); app.toast("ఫలితాలు కాపీ అయ్యాయి", { tone: "good" }); }
  catch {
    const box = el("textarea", { class: "copybox", readOnly: true, value: text, attrs: { "aria-label": "ఫలితాలు" } });
    app.sheet("ఫలితాలు కాపీ చేయండి", [el("p", { class: "hint", text: "ఎంచుకుని కాపీ చేయండి:" }), box]);
    box.select();
  }
}

/* ambient letters behind the empty state only (never behind results) */
let backdrop = null, backdropGone = false;
function disposeBackdrop() { backdropGone = true; backdrop?.dispose(); backdrop = null; }

/* =====================================================================================
   SELF-TEST (?debug=1 → window.__ak.selfTest())
   ===================================================================================== */
function selfTest() {
  const checks = [];
  const check = (name, got, want) => checks.push({ name, ok: JSON.stringify(got) === JSON.stringify(want), got: JSON.stringify(got), want: JSON.stringify(want) });
  const fam13 = ganaIndex(["eka", "rendu", "moodu"]), famAll = ganaIndex(FAMILIES.map(f => f.key));
  check("UIIUII with 1–3-syllable families (tribonacci)", countTable("UIIUII", fam13)[0].toString(), "24");
  check("UIIUII with all six families (audit's true count)", countTable("UIIUII", famAll)[0].toString(), "27");
  check("5 syllables IIIII, 1–3 families", countTable("IIIII", fam13)[0].toString(), "13");
  const l27 = listPartitions("UIIUII", famAll, 1000);
  check("all 27 listed, distinct, valid", [l27.length, new Set(l27.map(c => c.map(s => s.pattern).join("|"))).size, l27.every(c => c.map(s => s.pattern).join("") === "UIIUII")], [27, 27, true]);
  check("cap respected (5 of 27)", listPartitions("UIIUII", famAll, 5).length, 5);
  check("first listed = longest ganas first (utpalamala)", listPartitions("UIIUIUIIIUIIUIIUIUIU", fam13, 1)[0].map(s => s.pattern).join(" "), "UII UIU III UII UII UIU IU");
  // brute force cross-check of the counter on random sequences and family subsets
  let bfOK = true;
  for (let t = 0; t < 60 && bfOK; t++) {
    const n = 1 + (t % 10), seq = Array.from({ length: n }, () => (Math.random() < 0.5 ? "U" : "I")).join("");
    const fams = FAMILIES.filter(() => Math.random() < 0.6).map(f => f.key), gi = ganaIndex(fams);
    let bf = 0;
    for (let mask = 0; mask < 1 << (n - 1); mask++) {
      let s = 0, ok = true;
      for (let i = 1; i <= n && ok; i++) if (i === n || mask & (1 << (i - 1))) { if (!gi.map.has(seq.slice(s, i))) ok = false; s = i; }
      if (ok) bf++;
    }
    if (countTable(seq, gi)[0] !== BigInt(bf)) bfOK = false;
  }
  check("counter matches brute force (60 random cases)", bfOK, true);
  check("duplicate patterns keep every family/name (UI)", famAll.map.get("UI").map(l => l.name), ["Galamu (Ha)", "Ha"]);
  const crlf = analyze("రాము\r\n\tసీత 123 ౧౨౩\r\n");
  check("CRLF / tab / digits are not aksharas", crlf.items.map(i => i.key), ["రా", "ము", "సీ", "త"]);
  check("CRLF text → 2 పాదాలు, sequence", [crlf.padas.length, crlf.sequence], [2, "UIUI"]);
  check("sentence count", analyze("రాము వచ్చాడు. సీత వెళ్ళింది? అవును! ౧.").sentenceCount, 3);
  check("no punctuation → 1 sentence", analyze(SAMPLE).sentenceCount, 1);
  check("ౘ is a consonant now", tagsOf("ౘ").includes("హల్లు") && tagsOf("ౘ").includes("చ వర్గము"), true);
  check("ఌ is a vowel now", tagsOf("ఌ").includes("అచ్చు"), true);
  check("pollu joins the previous akshara (పెన్)", analyze("పెన్ను పెన్").items.map(i => i.key), ["పె", "న్ను", "పెన్"]);
  check("ఁ ignored for keys, kept for display", analyze("వేఁడు").items.map(i => [i.key, i.display]), [["వే", "వేఁ"], ["డు", "డు"]]);
  check("sample padyam line 1 U/I", analyze(SAMPLE).padas[0].items.map(i => analyze(SAMPLE).items[i].mark).join(""), "UIIUIUIIIUIIUIIUIUIU");
  // injection renders as text
  const inj = `<img src=x onerror="window.__akXSS=1"><b>బలం</b>`;
  const host = el("div");
  renderSingle(analyze(inj), host);
  check("injection: no <img>/<b> elements created", host.querySelectorAll("img, b.injected, script").length + [...host.querySelectorAll("b")].filter(b => b.textContent === "బలం").length, 0);
  check("injection: raw text shown as text", host.textContent.includes("<img src=x onerror="), true);
  const cHost = el("div");
  renderCompare(compareTexts(inj, "<svg onload=alert(1)>రాము"), cHost);
  check("injection in compare renders as text", [cHost.querySelectorAll("img, svg[onload]").length, cHost.textContent.includes("<img src=x")], [0, true]);
  check("window.__akXSS untouched", typeof window.__akXSS, "undefined");
  const json = buildJSON(analyze("UIIUII అమ్మ"), { families: ["eka", "rendu", "moodu"], cap: 3 });
  check("JSON schema + count", [json.metadata.schemaVersion, json.prosody.ganaCombinations.countExact, json.prosody.ganaCombinations.combinations.length], [SCHEMA_VERSION, "2", 2]);
  const ok = checks.every(c => c.ok);
  console.table(checks);
  console.log(ok ? "అక్షరానుసారిక self-test: all passed" : "అక్షరానుసారిక self-test: FAILURES");
  return { ok, passed: checks.filter(c => c.ok).length, total: checks.length, checks };
}

/* =====================================================================================
   BOOT
   ===================================================================================== */
const q = params();
if (q.has("a") || q.has("b")) {
  inA.value = q.get("a") ?? ""; inB.value = q.get("b") ?? "";
  showTab("compare");
  if (inA.value.trim() && inB.value.trim()) runCompare({ scroll: false });
} else if (q.has("text")) {
  input.value = q.get("text");
  if (input.value.trim()) runSingle({ scroll: false });
}
if (!state.single && !prefersReducedMotion()) {
  import("tt/three-kit.js")
    .then(m => m.createBackdrop(empty, { count: 12, opacity: 0.12, letters: ["U", "I", "గ", "ల", "భ", "ర", "న", "స", "య", "మ", "జ", "త"] }))
    .then(b => { backdrop = b; if (backdropGone) disposeBackdrop(); })
    .catch(() => {});
}
if (DEBUG) window.__ak = { analyze, compareTexts, buildJSON, countTable, listPartitions, ganaIndex, categorizeAksharam, renderSingle, renderCompare, selfTest,
  get state() { return state; }, GANA_DEFINITIONS, FAMILIES, VERSION, SCHEMA_VERSION };
</script>
